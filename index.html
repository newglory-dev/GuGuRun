<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8"/>
		<title>구구런 - 구구단 타임어택 연습</title>
		<!-- 반응형 -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #f8e9ff, #e3f2ff);
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .app {
        width: 100%;
        max-width: 480px;
        margin: 16px;
        padding: 24px 20px;
        border-radius: 24px;
        background: #ffffffcc;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      .title {
        text-align: center;
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: linear-gradient(90deg, #7f5dff, #ff6fb1);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 16px;
      }

      .question-box {
        margin: 16px 0;
        padding: 18px 12px;
        border-radius: 18px;
        background: #f4f0ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .question-label {
        font-size: 0.9rem;
        color: #777;
      }

      .question {
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .timer {
        font-size: 0.9rem;
        color: #8c68ff;
      }

      .answer-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .answer-input {
        flex: 1;
        padding: 10px 12px;
        font-size: 1.2rem;
        border-radius: 12px;
        border: 2px solid #d6c7ff;
        outline: none;
        text-align: center;
      }

      .answer-input:focus {
        border-color: #8c68ff;
        box-shadow: 0 0 0 3px #e2d8ff;
      }

      .primary-button {
        padding: 10px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #8c68ff, #ff6fb1);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      .stats {
        margin-top: 12px;
        padding: 12px 10px;
        border-radius: 16px;
        background: #f9fbff;
        font-size: 0.9rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 4px;
      }

      .stats span.label {
        color: #777;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 0.95rem;
      }

      .result.ok {
        background: #e8f9f1;
        color: #1c7c4e;
      }

      .result.bad {
        background: #ffeff0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #888;
        text-align: center;
      }

      @media (max-width: 480px) {
        .question {
          font-size: 2rem;
        }
      }
    </style>
	</head>
	<body>
		<div id="root"/>
		<!-- React & ReactDOM & Babel (개발용) -->
		<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"/>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"/>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"/>
		<!-- React 코드 -->
		<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function getRandomQuestion() {
    const a = Math.floor(Math.random() * 8) + 2; // 2~9
    const b = Math.floor(Math.random() * 9) + 1; // 1~9
    return { a, b };
  }

  function PracticeMode() {
    const [question, setQuestion] = useState(getRandomQuestion);
    const [answer, setAnswer] = useState("");
    const [questionStart, setQuestionStart] = useState(Date.now());
    const [lastCorrect, setLastCorrect] = useState(null);
    const [lastMessage, setLastMessage] = useState("");
    const [total, setTotal] = useState(0);
    const [correct, setCorrect] = useState(0);
    const [sumTime, setSumTime] = useState(0);
    const inputRef = useRef(null);

    useEffect(() => {
      setQuestionStart(Date.now());
      setAnswer("");
      if (inputRef.current) inputRef.current.focus();
    }, [question]);

    const handleSubmit = () => {
      if (!answer.trim()) return;
      const now = Date.now();
      const elapsed = (now - questionStart) / 1000;
      const correctAnswer = question.a * question.b;
      const user = Number(answer.trim());

      setTotal((t) => t + 1);
      setSumTime((s) => s + elapsed);

      if (user === correctAnswer) {
        setCorrect((c) => c + 1);
        setLastCorrect(true);
        setLastMessage(`정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`);
      } else {
        setLastCorrect(false);
        setLastMessage(
          `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(2)}초)`
        );
      }

      setQuestion(getRandomQuestion());
    };

    const handleKeyDown = (e) => {
      if (e.key === "Enter") handleSubmit();
    };

    const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
    const accuracy = total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

    return (
      <>
				<div className="question-box">
					<div className="question-label">연습 모드 - 지금 문제</div>
					<div className="question">
            {question.a} × {question.b} = ?
          </div>
					<div className="timer">
            문제 보인 지 {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
          </div>
					<div className="answer-row">
						<input ref={inputRef} className="answer-input" type="tel" inputMode="numeric" value={answer} onChange={(e)=>
                setAnswer(e.target.value.replace(/[^0-9]/g, ""))
              }
              onKeyDown={handleKeyDown}
              placeholder="정답 입력"
            />
            <button className="primary-button" onClick={handleSubmit}> 확인
						</button>
					</div>
				</div>
				<div className="stats">
					<span className="label">총 문제 수</span>
					<span className="value">{total}</span>
					<span className="label">정답 개수</span>
					<span className="value">{correct}</span>
					<span className="label">정답률</span>
					<span className="value">{accuracy}</span>
					<span className="label">평균 반응속도</span>
					<span className="value">
            {avgTime === "-" ? "-" : `${avgTime}초`}
          </span>
				</div>

        {lastMessage && (
          <div className={`result ${lastCorrect ?"ok" :"bad" }`}> {lastMessage}
			</div>
        )}

        <div className="small-tip">
          연습 모드는 시간 제한 없이 천천히 정확도와 속도를 올리는 모드입니다. <br/>
          아래에서 <b>타임어택 모드</b>를 선택하면 60초 미션을 할 수 있어요.
        </div>
		</>
    );
  }

  function TimeAttackMode() {
    const [question, setQuestion] = useState(getRandomQuestion);
    const [answer, setAnswer] = useState("");
    const [questionStart, setQuestionStart] = useState(Date.now());
    const [running, setRunning] = useState(false);
    const [timeLeftMs, setTimeLeftMs] = useState(60000); // 60초
    const [total, setTotal] = useState(0);
    const [correct, setCorrect] = useState(0);
    const [sumTime, setSumTime] = useState(0);
    const [lastMessage, setLastMessage] = useState("");
    const [finished, setFinished] = useState(false);
    const timerRef = useRef(null);
    const inputRef = useRef(null);

    // 타임어택 시작
    const startGame = () => {
      setRunning(true);
      setFinished(false);
      setTimeLeftMs(60000);
      setTotal(0);
      setCorrect(0);
      setSumTime(0);
      setLastMessage("");
      setQuestion(getRandomQuestion());
      setQuestionStart(Date.now());
      if (inputRef.current) inputRef.current.focus();
    };

    // 타이머 useEffect
    useEffect(() => {
      if (!running) {
        if (timerRef.current) {
          clearInterval(timerRef.current);
          timerRef.current = null;
        }
        return;
      }

      timerRef.current = setInterval(() => {
        setTimeLeftMs((prev) => {
          const next = prev - 100;
          if (next <= 0) { 종료 clearInterval(timerRef.current); timerRef.current=null; setRunning(false); setFinished(true); return 0; } return next; }); }, 100); return ()=> {
        if (timerRef.current) {
          clearInterval(timerRef.current);
          timerRef.current = null;
        }
      };
    }, [running]);

    useEffect(() => {
      setQuestionStart(Date.now());
      setAnswer("");
      if (running && inputRef.current) inputRef.current.focus();
    }, [question, running]);

    const handleSubmit = () => {
      if (!running) return;
      if (!answer.trim()) return;

      const now = Date.now();
      const elapsed = (now - questionStart) / 1000;
      const correctAnswer = question.a * question.b;
      const user = Number(answer.trim());

      setTotal((t) => t + 1);
      setSumTime((s) => s + elapsed);

      if (user === correctAnswer) {
        setCorrect((c) => c + 1);
        setLastMessage(
          `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
        );
      } else {
        setLastMessage(
          `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
        );
      }

      setQuestion(getRandomQuestion());
    };

    const handleKeyDown = (e) => {
      if (e.key === "Enter") handleSubmit();
    };

    const secondsLeft = (timeLeftMs / 1000).toFixed(1);
    const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
    const accuracy =
      total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

    let grade = "-";
    if (avgTime !== "-" && total > 0) {
      const t = parseFloat(avgTime);
      if (t < 1.5)grade= "S";else if (t
			< 2.5) grade="A" ; else if (t
			< 3.5) grade="B" ; else grade="C" ; } return (
			<>
				<div className="question-box">
					<div className="question-label">
            타임어택 모드 - 60초 안에 최대한 많이!
          </div>
					<div className="timer">
            남은 시간:{" "}
            <b style={{ color: timeLeftMs
						< 10000 ?"#c62828" :"#8c68ff" }}> {secondsLeft}초
					</b>
				</div>
				<div className="question" style={{ marginTop: 8 }}> {question.a} × {question.b}=?
			</div>
			<div className="answer-row" style={{ marginTop: 12 }}>
			<input ref={inputRef} className="answer-input" type="tel" inputMode="numeric" value={answer} onChange={(e)=>
                setAnswer(e.target.value.replace(/[^0-9]/g, ""))
              }
              onKeyDown={handleKeyDown}
              placeholder={running ? "정답 입력" : "시작하기를 눌러주세요"}
              disabled={!running}
            />
            <button className="primary-button" onClick={running ? handleSubmit : startGame}> {running ?"확인" :"시작하기" }
			</button>
		</div>
	</div>
	<div className="stats">
		<span className="label">푼 문제 수</span>
		<span className="value">{total}</span>
		<span className="label">정답 개수</span>
		<span className="value">{correct}</span>
		<span className="label">정답률</span>
		<span className="value">{accuracy}</span>
		<span className="label">평균 반응속도</span>
		<span className="value">
            {avgTime === "-" ? "-" : `${avgTime}초`}
          </span>
	</div>

        {finished && (
          <div className="result ok">
            타임어택 종료! 🎉<br/>
		<b>{total}</b>문제 중 <b>{correct}</b>개 정답, 정답률 {accuracy}, <br/>
            평균 {avgTime === "-" ? "-" : `${avgTime}초`} / 등급 {grade} 등급!
          </div>
        )}

        {lastMessage && !finished && (
          <div className="result ok">{lastMessage}</div>
        )}

        <div className="small-tip">
          타임어택에서 <b>S/A 등급</b>을 목표로 해보면 동기부여가 잘 됩니다. <br/>
          나중에 이 결과를 기반으로 <b>미션/보상 시스템</b>을 추가할 수 있어요.
        </div>
</>
    );
  }

  function App() {
    const [mode, setMode] = useState("practice"); // 'practice' | 'timeAttack'

    return (
      <div className="app">
	<div className="title">구구런 GUGU RUN</div>
	<div className="subtitle">구구단 스피드 & 타임어택 연습</div>
	<div style={{ display:"flex" , gap: 8, marginTop: 8, marginBottom: 8, }}>
		<button className="primary-button" style={{ flex: 1, opacity: mode==="practice" ? 1 : 0.5, }} onClick={()=> setMode("practice")}
          >
            연습 모드
          </button>
		<button className="primary-button" style={{ flex: 1, opacity: mode==="timeAttack" ? 1 : 0.5, }} onClick={()=> setMode("timeAttack")}
          >
            타임어택 모드
          </button>
	</div>

        {mode === "practice" ? <PracticeMode/> : <TimeAttackMode/>}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
</html>
