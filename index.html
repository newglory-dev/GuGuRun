<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유라의 구구런 GUGU RUN - 구구단 타임어택 연습</title>
    <!-- 반응형 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #f8e9ff, #e3f2ff);
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .app {
        width: 100%;
        max-width: 480px;
        margin: 16px;
        padding: 24px 20px;
        border-radius: 24px;
        background: #ffffffcc;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      .title {
        text-align: center;
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: linear-gradient(90deg, #7f5dff, #ff6fb1);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 16px;
      }

      .question-box {
        margin: 16px 0;
        padding: 18px 12px;
        border-radius: 18px;
        background: #f4f0ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .question-label {
        font-size: 0.9rem;
        color: #777;
      }

      .question {
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .timer {
        font-size: 0.9rem;
        color: #8c68ff;
      }

      .stats {
        margin-top: 12px;
        padding: 12px 10px;
        border-radius: 16px;
        background: #f9fbff;
        font-size: 0.9rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 4px;
      }

      .stats span.label {
        color: #777;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 0.95rem;
      }

      .result.ok {
        background: #e8f9f1;
        color: #1c7c4e;
      }

      .result.bad {
        background: #ffeff0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #888;
        text-align: center;
      }

      .primary-button {
        padding: 10px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #8c68ff, #ff6fb1);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      /* 객관식 선택지 스타일 */
      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
        width: 100%;
      }

      .choice-btn {
        padding: 10px 0;
        border-radius: 12px;
        border: none;
        background: #ffffff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .choice-btn:active {
        transform: translateY(1px);
      }

      .choice-btn.correct-hint {
        background: #e8f9f1;
      }

      @media (max-width: 480px) {
        .question {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM & Babel (개발용) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 코드 -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function getRandomQuestion() {
        const a = Math.floor(Math.random() * 8) + 2; // 2~9
        const b = Math.floor(Math.random() * 9) + 1; // 1~9
        return { a, b };
      }

      // 정답 + 오답 여러 개 = 총 6개 보기
      function getChoices(correct) {
        const set = new Set();
        set.add(correct);

        while (set.size < 6) {
          const delta = Math.floor(Math.random() * 9) - 4; // -4 ~ +4
          if (delta === 0) continue;
          const candidate = correct + delta;
          if (candidate <= 0) continue;
          set.add(candidate);
        }

        return Array.from(set).sort(() => Math.random() - 0.5); // 섞기
      }

      // 바로 직전 문제와 같지 않도록 보장
      function getQuestionWithChoices(prevQuestion) {
        let base;
        do {
          base = getRandomQuestion();
        } while (
          prevQuestion &&
          base.a === prevQuestion.a &&
          base.b === prevQuestion.b
        );

        const correct = base.a * base.b;
        return {
          ...base,
          choices: getChoices(correct),
        };
      }

      // ========= 연습 모드 =========
      function PracticeMode() {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [lastCorrect, setLastCorrect] = useState(null);
        const [lastMessage, setLastMessage] = useState("");
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastCorrect(true);
            setLastMessage(
              `정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastCorrect(false);
            setLastMessage(
              `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(
                2
              )}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                연습 모드 - 객관식 스피드 연습
              </div>
              <div className="question">
                {question.a} × {question.b} = ?
              </div>
              <div className="timer">
                문제 보인 지{" "}
                {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="stats">
              <span className="label">총 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {lastMessage && (
              <div className={`result ${lastCorrect ? "ok" : "bad"}`}>
                {lastMessage}
              </div>
            )}

            <div className="small-tip">
              답을 <b>직접 누르기만</b> 하면 되도록 바꾼 연습 모드입니다. <br />
              손가락만으로도 빠르게 스피드런 연습을 할 수 있어요.
            </div>
          </>
        );
      }

      // ========= 타임어택 모드 =========
      function TimeAttackMode() {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [running, setRunning] = useState(false);
        const [timeLeftMs, setTimeLeftMs] = useState(60000); // 60초
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [lastMessage, setLastMessage] = useState("");
        const [finished, setFinished] = useState(false);
        const timerRef = useRef(null);

        const startGame = () => {
          setRunning(true);
          setFinished(false);
          setTimeLeftMs(60000);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setQuestion((prev) => getQuestionWithChoices(prev));
          setQuestionStart(Date.now());
        };

        useEffect(() => {
          if (!running) {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
            return;
          }

          timerRef.current = setInterval(() => {
            setTimeLeftMs((prev) => {
              const next = prev - 100;
              if (next <= 0) {
                clearInterval(timerRef.current);
                timerRef.current = null;
                setRunning(false);
                setFinished(true);
                return 0;
              }
              return next;
            });
          }, 100);

          return () => {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [running]);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          if (!running) return;

          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const secondsLeft = (timeLeftMs / 1000).toFixed(1);
        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        let grade = "-";
        if (avgTime !== "-" && total > 0) {
          const t = parseFloat(avgTime);
          if (t < 1.5) grade = "S";
          else if (t < 2.5) grade = "A";
          else if (t < 3.5) grade = "B";
          else grade = "C";
        }

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                타임어택 모드 - 60초 안에 최대한 많이!
              </div>

              <div className="timer">
                남은 시간:{" "}
                <b style={{ color: timeLeftMs < 10000 ? "#c62828" : "#8c68ff" }}>
                  {secondsLeft}초
                </b>
              </div>

              <div className="question" style={{ marginTop: 8 }}>
                {question.a} × {question.b} = ?
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                    disabled={!running}
                  >
                    {c}
                  </button>
                ))}
              </div>

              <div style={{ marginTop: 12, textAlign: "center" }}>
                <button
                  className="primary-button"
                  onClick={startGame}
                  style={{ padding: "8px 18px" }}
                >
                  {running ? "다시 시작" : "시작하기"}
                </button>
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>
