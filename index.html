<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유라의 구구런 GUGU RUN - 구구단 타임어택 연습</title>
    <!-- 반응형 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #ccf6ff, #e0fffb);
        color: #333;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding-top: 8px;
      }

      .app {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 18px 16px;
        border-radius: 24px;
        background: #f7feff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        border: 1px solid #b3ecff;
      }

      .title {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: linear-gradient(90deg, #00c9a7, #00a8ff);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #28708a;
        margin-bottom: 6px;
      }

      .profile-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 6px;
        padding: 8px 10px;
        border-radius: 14px;
        background: #ecfcff;
        border: 1px solid #c0f0ff;
        font-size: 0.78rem;
        color: #345;
      }

      .profile-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .profile-title {
        font-weight: 700;
      }

      .profile-level {
        font-size: 0.82rem;
        font-weight: 700;
        color: #008b8b;
      }

      .xp-bar {
        position: relative;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #d6f7ff;
        overflow: hidden;
        margin-top: 2px;
      }

      .xp-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #00c9a7, #00a8ff);
      }

      .xp-text {
        font-size: 0.7rem;
        text-align: right;
        color: #567;
        margin-top: 2px;
      }

      .question-box {
        margin: 10px 0;
        padding: 14px 10px;
        border-radius: 18px;
        background: #e7fbff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 1px dashed #7ee0ff;
        transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      }

      .question-box.fever {
        background: linear-gradient(135deg, #d9fff3, #e5fffb);
        box-shadow: 0 0 0 2px #00c9a777, 0 6px 14px rgba(0, 0, 0, 0.12);
        transform: translateY(-1px);
      }

      .fever-label {
        font-size: 0.75rem;
        color: #00a86b;
        font-weight: 700;
      }

      .question-label {
        font-size: 0.85rem;
        color: #28708a;
      }

      .question {
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .timer {
        font-size: 0.85rem;
        color: #00a8ff;
      }

      .combo-row {
        margin-top: 2px;
        font-size: 0.8rem;
        color: #345;
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .combo-current {
        font-weight: 700;
        color: #007f7f;
      }

      .combo-best {
        color: #567;
      }

      .stats {
        margin-top: 10px;
        padding: 10px 8px;
        border-radius: 14px;
        background: #f0fcff;
        font-size: 0.85rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 2px;
        border: 1px solid #ccefff;
      }

      .stats span.label {
        color: #567;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 0.9rem;
      }

      .result.ok {
        background: #e3fbf3;
        color: #0c7a4c;
      }

      .result.bad {
        background: #ffeef0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 6px;
        font-size: 0.78rem;
        color: #567;
        text-align: center;
      }

      .primary-button {
        padding: 8px 14px;
        border-radius: 16px;
        border: none;
        background: linear-gradient(135deg, #00c9a7, #00a8ff);
        color: white;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      /* 객관식 선택지 스타일 */
      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
        width: 100%;
      }

      .choice-btn {
        padding: 8px 0;
        border-radius: 14px;
        border: none;
        background: #ffffff;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.06);
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
      }

      .choice-btn:active {
        transform: translateY(1px);
      }

      .section-title {
        font-size: 0.78rem;
        color: #456;
      }

      .pill-chip {
        padding: 4px 8px;
        border-radius: 999px;
        border: none;
        font-size: 0.78rem;
        cursor: pointer;
        background: #d3f8ff;
        color: #28708a;
      }

      .pill-chip.active {
        background: #00c9a7;
        color: #fff;
      }

      .tab-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        margin-bottom: 4px;
      }

      .tab-btn {
        flex: 1;
        padding: 8px 0;
        border-radius: 16px;
        border: none;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        background: #d3f8ff;
        color: #28708a;
      }

      .tab-btn.active {
        background: linear-gradient(135deg, #00c9a7, #00a8ff);
        color: #fff;
      }

      .share-row {
        margin-top: 6px;
        text-align: center;
      }

      .share-button {
        padding: 6px 10px;
        border-radius: 14px;
        border: none;
        background: #ffdd57;
        color: #5a4300;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .share-button:active {
        transform: translateY(1px);
      }

      .records-box {
        margin-top: 6px;
        padding: 8px 8px;
        border-radius: 14px;
        background: #f0fcff;
        font-size: 0.8rem;
        color: #345;
        border: 1px solid #ccefff;
      }

      .records-box h3 {
        margin: 0 0 4px;
        font-size: 0.85rem;
        color: #256d85;
      }

      .records-table-wrapper {
        margin-top: 4px;
        max-height: 260px;
        overflow-y: auto;
      }

      table.records-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }

      table.records-table thead {
        background: #d9f5ff;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      table.records-table th,
      table.records-table td {
        padding: 3px 4px;
        text-align: center;
        border-bottom: 1px solid #e3f2ff;
        white-space: nowrap;
      }

      table.records-table tbody tr:nth-child(even) {
        background: #f6fcff;
      }

      .badge-row {
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .badge {
        padding: 3px 6px;
        border-radius: 999px;
        border: 1px solid #a0e7ff;
        background: #e6fbff;
        font-size: 0.72rem;
        color: #256d85;
      }

      .badge.earned {
        border-color: #00c9a7;
        background: #d9fff5;
        color: #007f66;
        font-weight: 600;
      }

      .mission-info-row {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
      }

      .mission-label {
        font-size: 0.8rem;
        color: #345;
      }

      .mission-value {
        font-size: 0.8rem;
        font-weight: 600;
        color: #007f66;
      }

      /* 타이머 프로그레스 바 */
      .time-bar {
        position: relative;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #d6f7ff;
        overflow: hidden;
        margin-top: 4px;
      }

      .time-bar-inner {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #00c9a7, #00a8ff);
        transition: width 0.1s linear;
      }

      .time-bar-text {
        position: absolute;
        top: -16px;
        right: 0;
        font-size: 0.8rem;
        color: #00a8ff;
      }

      /* 미션 카드 레이아웃 */
      .mission-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
      }

      .mission-item {
        padding: 6px 8px;
        border-radius: 10px;
        background: #e8f8ff;
        border: 1px solid #c3ecff;
      }

      .mission-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
      }

      .mission-title {
        color: #234;
        font-weight: 600;
      }

      .mission-status {
        font-size: 0.78rem;
        font-weight: 600;
      }

      .mission-status.done {
        color: #008b39;
      }

      .mission-status.pending {
        color: #007bff;
      }

      .mission-progress {
        margin-top: 2px;
        font-size: 0.78rem;
        color: #456;
      }

      /* 미션 완료 팝업 */
      .mission-popup-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .mission-popup-card {
        width: 90%;
        max-width: 360px;
        background: #fdfefc;
        border-radius: 18px;
        padding: 14px 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        border: 1px solid #ffe48a;
      }

      .mission-popup-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #5a4300;
        margin-bottom: 6px;
      }

      .mission-popup-text {
        font-size: 0.8rem;
        color: #444;
        line-height: 1.4;
        max-height: 220px;
        overflow-y: auto;
      }

      .mission-popup-buttons {
        margin-top: 10px;
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .mission-popup-btn {
        padding: 7px 10px;
        border-radius: 999px;
        border: none;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }

      .mission-popup-btn.primary {
        background: #ffdd57;
        color: #5a4300;
      }

      .mission-popup-btn.secondary {
        background: #e0f3ff;
        color: #22516e;
      }

      .mission-popup-btn:active {
        transform: translateY(1px);
      }

      @media (max-width: 400px) {
        .app {
          padding: 14px 12px;
          border-radius: 20px;
        }
        .question {
          font-size: 1.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM & Babel (개발용) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 코드 -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function getRandomQuestion() {
        const a = Math.floor(Math.random() * 8) + 2; // 2~9
        const b = Math.floor(Math.random() * 9) + 1; // 1~9
        return { a, b };
      }

      // 정답 근처 숫자 위주의 6지선다
      function getChoices(correct) {
        const set = new Set();
        set.add(correct);

        while (set.size < 6) {
          const delta = Math.floor(Math.random() * 9) - 4; // -4 ~ +4
          if (delta === 0) continue;
          const candidate = correct + delta;
          if (candidate <= 0) continue;
          set.add(candidate);
        }

        return Array.from(set).sort(() => Math.random() - 0.5); // 섞기
      }

      // 바로 직전 문제와 같지 않도록 보장
      function getQuestionWithChoices(prevQuestion) {
        let base;
        do {
          base = getRandomQuestion();
        } while (
          prevQuestion &&
          base.a === prevQuestion.a &&
          base.b === prevQuestion.b
        );

        const correct = base.a * base.b;
        return {
          ...base,
          choices: getChoices(correct),
        };
      }

      // ===== 로컬스토리지 유틸 =====
      const STORAGE_KEY = "gugurun_timeattack_records_v2";

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch (e) {
          return [];
        }
      }

      function saveRecord(record) {
        try {
          const records = loadRecords();
          records.push(record);
          const trimmed = records.slice(-200);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
          return trimmed;
        } catch (e) {
          return null;
        }
      }

      function compareRecord(a, b) {
        if (a.correct !== b.correct) return b.correct - a.correct;
        if (a.total !== b.total) return b.total - a.total;
        const at = parseFloat(a.avgTime || "999");
        const bt = parseFloat(b.avgTime || "999");
        if (!isNaN(at) && !isNaN(bt) && at !== bt) return at - bt;
        return (b.timestamp || 0) - (a.timestamp || 0);
      }

      function pickBestRecord(records) {
        if (!records || records.length === 0) return null;
        const sorted = [...records].sort(compareRecord);
        return sorted[0];
      }

      function getTopRecords(records, limit = 10) {
        if (!records || records.length === 0) return [];
        const sorted = [...records].sort(compareRecord);
        return sorted.slice(0, limit);
      }

      // ===== 프로필/레벨 계산 =====
      function calcProfileFromRecords(records) {
        let xp = 0;
        if (records && records.length > 0) {
          for (const r of records) {
            const correct = r.correct || 0;
            const total = r.total || 0;
            const grade = r.grade || "-";
            xp += correct * 10 + total * 2;
            if (grade === "S") xp += 100;
            else if (grade === "A") xp += 50;
          }
        }
        const level = Math.floor(xp / 300) + 1;
        const levelBaseXp = (level - 1) * 300;
        const xpForNextLevel = 300;
        const xpInLevel = xp - levelBaseXp;
        const title = getTitleForLevel(level);
        return {
          xp,
          level,
          title,
          xpInLevel,
          xpForNextLevel,
        };
      }

      function getTitleForLevel(level) {
        if (level <= 1) return "구구단 새싹 유라";
        if (level <= 3) return "구구단 성장 유라";
        if (level <= 5) return "구구단 반장 유라";
        if (level <= 7) return "구구단 천재(?) 유라";
        if (level <= 9) return "구구런 불꽃 유라";
        return "구구런 마스터 유라";
      }

      // ===== 등급 우선순위 =====
      function gradePriority(g) {
        if (g === "S") return 3;
        if (g === "A") return 2;
        if (g === "B") return 1;
        if (g === "C") return 0;
        return -1;
      }

      // ===== 오늘/주간 미션 + 용돈 계산 =====
      function calcTodayMissionAndAllowance(records) {
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);

        // 오늘 필터
        const todayRecords = (records || []).filter((r) => {
          if (!r.timestamp) return false;
          const d = new Date(r.timestamp);
          const dateStr = d.toISOString().slice(0, 10);
          return dateStr === todayStr;
        });

        // 이번 주 (월~일)
        const weekStart = new Date(now);
        weekStart.setHours(0, 0, 0, 0);
        const day = weekStart.getDay(); // 0~6
        const diffFromMonday = (day + 6) % 7;
        weekStart.setDate(weekStart.getDate() - diffFromMonday);

        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        weekEnd.setHours(23, 59, 59, 999);

        const weekRecords = (records || []).filter((r) => {
          if (!r.timestamp) return false;
          const d = new Date(r.timestamp);
          return d >= weekStart && d <= weekEnd;
        });

        const pad2 = (n) => n.toString().padStart(2, "0");
        const weekRangeStr =
          `${weekStart.getFullYear()}.${pad2(weekStart.getMonth() + 1)}.${pad2(
            weekStart.getDate()
          )}` +
          ` ~ ` +
          `${pad2(weekEnd.getMonth() + 1)}.${pad2(weekEnd.getDate())}`;

        // 오늘 통계
        let todayCountAll = todayRecords.length;
        let todayCount60 = 0;
        let todayCorrectSum = 0;
        let bestGrade = "-";

        for (const r of todayRecords) {
          if (r.timeLimitSec === 60) todayCount60 += 1;
          todayCorrectSum += r.correct || 0;
          const g = r.grade || "-";
          if (gradePriority(g) > gradePriority(bestGrade)) {
            bestGrade = g;
          }
        }

        // 주간 통계
        let weekCountAll = weekRecords.length;
        let weekCorrectSum = 0;
        for (const r of weekRecords) {
          weekCorrectSum += r.correct || 0;
        }

        // 일일 미션
        const dailyMissions = [
          {
            id: "daily_60s_2times",
            title: "60초 타임어택 2회 도전",
            done: todayCount60 >= 2,
            progress: `${todayCount60} / 2회`,
          },
          {
            id: "daily_correct_30",
            title: "정답 30개 맞히기",
            done: todayCorrectSum >= 30,
            progress: `${todayCorrectSum} / 30개`,
          },
          {
            id: "daily_grade_A_or_S",
            title: "오늘 A 또는 S 등급 한 번 달성",
            done: gradePriority(bestGrade) >= gradePriority("A"),
            progress:
              bestGrade === "-"
                ? "아직 등급 없음"
                : `현재 최고 등급: ${bestGrade}`,
          },
        ];

        // 주간 미션
        const weeklyMissions = [
          {
            id: "weekly_20_times",
            title: "이번 주 타임어택 20회 도전",
            done: weekCountAll >= 20,
            progress: `${weekCountAll} / 20회`,
          },
          {
            id: "weekly_200_correct",
            title: "이번 주 정답 200개 이상",
            done: weekCorrectSum >= 200,
            progress: `${weekCorrectSum} / 200개`,
          },
        ];

        // 용돈 계산 (하루 1번)
        let allowance = 0;
        if (bestGrade === "S") allowance = 1000;
        else if (bestGrade === "A") allowance = 500;

        return {
          todayStr,
          todayCountAll,
          todayCount60,
          todayCorrectSum,
          bestGrade,
          allowance,
          dailyMissions,
          weeklyMissions,
          weekRangeStr,
        };
      }

      // ===== 업적 배지 =====
      function calcBadges(records) {
        const badges = [
          {
            id: "first_attack",
            label: "첫 타임어택 완료",
            earned: false,
          },
          {
            id: "grade_s",
            label: "S 등급 달성",
            earned: false,
          },
          {
            id: "grade_a_or_b",
            label: "A/B 등급 여러 번",
            earned: false,
          },
          {
            id: "thirty_15correct",
            label: "30초 모드에서 15개 이상 정답",
            earned: false,
          },
          {
            id: "sixty_25correct",
            label: "60초 모드에서 25개 이상 정답",
            earned: false,
          },
          {
            id: "combo_master",
            label: "정답률 100% 기록 얻기",
            earned: false,
          },
        ];

        if (!records || records.length === 0) return badges;

        let hasFirst = records.length > 0;
        let hasS = false;
        let highGradeCount = 0;
        let has30_15 = false;
        let has60_25 = false;
        let hasPerfect = false;

        for (const r of records) {
          if (r.grade === "S") hasS = true;
          if (r.grade === "S" || r.grade === "A" || r.grade === "B") {
            highGradeCount += 1;
          }
          if (r.timeLimitSec === 30 && (r.correct || 0) >= 15) {
            has30_15 = true;
          }
          if (r.timeLimitSec === 60 && (r.correct || 0) >= 25) {
            has60_25 = true;
          }
          const total = r.total || 0;
          const correct = r.correct || 0;
          if (total > 0 && correct === total) {
            hasPerfect = true;
          }
        }

        return badges.map((b) => {
          if (b.id === "first_attack") return { ...b, earned: hasFirst };
          if (b.id === "grade_s") return { ...b, earned: hasS };
          if (b.id === "grade_a_or_b")
            return { ...b, earned: highGradeCount >= 3 };
          if (b.id === "thirty_15correct") return { ...b, earned: has30_15 };
          if (b.id === "sixty_25correct") return { ...b, earned: has60_25 };
          if (b.id === "combo_master") return { ...b, earned: hasPerfect };
          return b;
        });
      }

      // ========= 연습 모드 =========
      function PracticeMode() {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [lastCorrect, setLastCorrect] = useState(null);
        const [lastMessage, setLastMessage] = useState("");
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [combo, setCombo] = useState(0);
        const [bestCombo, setBestCombo] = useState(0);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastCorrect(true);
            setLastMessage(
              `정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`
            );
            setCombo((prev) => {
              const next = prev + 1;
              setBestCombo((b) => Math.max(b, next));
              return next;
            });
          } else {
            setLastCorrect(false);
            setLastMessage(
              `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(
                2
              )}초)`
            );
            setCombo(0);
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        const isFever = combo >= 5;

        return (
          <>
            <div className={"question-box" + (isFever ? " fever" : "")}>
              {isFever && (
                <div className="fever-label">FEVER 모드! 연속 정답 유지 중 🔥</div>
              )}
              <div className="question-label">
                연습 모드 - 객관식 스피드 연습
              </div>
              <div className="question">
                {question.a} × {question.b} = ?
              </div>
              <div className="timer">
                문제 보인 지{" "}
                {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
              </div>

              <div className="combo-row">
                <span className="combo-current">콤보: {combo} 🔁</span>
                <span className="combo-best">최고 콤보: {bestCombo}</span>
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="stats">
              <span className="label">총 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {lastMessage && (
              <div className={`result ${lastCorrect ? "ok" : "bad"}`}>
                {lastMessage}
              </div>
            )}

            <div className="small-tip">
              답을 <b>톡톡 누르기만</b> 하면 되는 연습 모드예요. <br />
              콤보를 길게 이어 볼수록, 머릿속 계산기가 점점 빨라집니다.
            </div>
          </>
        );
      }

      // ========= 타임어택 모드 =========
      function TimeAttackMode({ timeLimitMs, onRecordsUpdated }) {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [running, setRunning] = useState(false);
        const [timeLeftMs, setTimeLeftMs] = useState(timeLimitMs);
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [lastMessage, setLastMessage] = useState("");
        const [finished, setFinished] = useState(false);
        const [justSetNewBest, setJustSetNewBest] = useState(false);
        const [combo, setCombo] = useState(0);
        const [bestCombo, setBestCombo] = useState(0);
        const [showMissionPopup, setShowMissionPopup] = useState(false);
        const [missionPopupText, setMissionPopupText] = useState("");
        const timerRef = useRef(null);

        const timeLimitSec = Math.round(timeLimitMs / 1000);

        useEffect(() => {
          setRunning(false);
          setFinished(false);
          setTimeLeftMs(timeLimitMs);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setJustSetNewBest(false);
          setCombo(0);
          setBestCombo(0);
          setShowMissionPopup(false);
        }, [timeLimitMs]);

        const startGame = () => {
          setRunning(true);
          setFinished(false);
          setTimeLeftMs(timeLimitMs);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setJustSetNewBest(false);
          setCombo(0);
          setBestCombo(0);
          setShowMissionPopup(false);
          setQuestion((prev) => getQuestionWithChoices(prev));
          setQuestionStart(Date.now());
        };

        // 타이머
        useEffect(() => {
          if (!running) {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
            return;
          }

          timerRef.current = setInterval(() => {
            setTimeLeftMs((prev) => {
              const next = prev - 100;
              if (next <= 0) {
                clearInterval(timerRef.current);
                timerRef.current = null;
                setRunning(false);
                setFinished(true);
                return 0;
              }
              return next;
            });
          }, 100);

          return () => {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [running]);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          if (!running) return;

          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setCombo((prev) => {
              const next = prev + 1;
              setBestCombo((b) => Math.max(b, next));
              return next;
            });
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setCombo(0);
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const secondsLeft = (timeLeftMs / 1000).toFixed(1);
        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        const progressPercent = Math.max(
          0,
          Math.min(100, (timeLeftMs / timeLimitMs) * 100)
        );

        // ★ 등급 기준 (S<2, A<3, B<4)
        let grade = "-";
        if (avgTime !== "-" && total > 0) {
          const t = parseFloat(avgTime);
          if (t < 2.0) grade = "S";
          else if (t < 3.0) grade = "A";
          else if (t < 4.0) grade = "B";
          else grade = "C";
        }

        // 결과 문구 생성 (공유/팝업에서 공통 사용)
        const buildSummary = () => {
          const lines = [];
          lines.push("유라의 구구런 타임어택 결과 보고!");
          lines.push(`- 모드: ${timeLimitSec}초`);
          lines.push(`- 정답: ${correct}/${total} (${accuracy})`);
          lines.push(`- 평균속도: ${avgTime}초`);
          lines.push(`- 등급: ${grade} 등급`);
          lines.push(`- 최고 콤보: ${bestCombo}콤보`);
          lines.push("");
          if (grade === "S" || grade === "A") {
            const money = grade === "S" ? 1000 : 500;
            lines.push(
              `오늘은 ${grade} 등급이니까, 약속한 용돈 ${money.toLocaleString()}원 주세요 😆`
            );
          } else {
            lines.push(
              `오늘은 S/A는 아니지만, 열심히 했어요! 칭찬도 주세요 😊`
            );
          }
          return lines.join("\n");
        };

        // 공유 (일반 공유 버튼)
        const shareResult = async () => {
          const summary = buildSummary();

          if (navigator.share) {
            try {
              await navigator.share({
                title: "유라의 구구런 GUGU RUN",
                text: summary,
                url: window.location.href,
              });
              return;
            } catch (e) {}
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(summary);
              alert(
                "타임어택 결과를 클립보드에 복사했어요.\n카카오톡을 열고 채팅창에 붙여넣기 해서 공유해 주세요!"
              );
              return;
            } catch (e) {}
          }

          window.prompt(
            "이 텍스트를 전체 선택(Ctrl+A) 후 복사해서 카카오톡에 붙여넣기 해 주세요:",
            summary
          );
        };

        // 팝업 내 카카오톡 공유(자동 복사)
        const handleMissionCopy = async () => {
          const text = missionPopupText || buildSummary();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              alert(
                "결과를 클립보드에 복사했어요.\n카카오톡을 열고 채팅창에 붙여넣기만 하면 돼요!"
              );
              setShowMissionPopup(false);
              return;
            } catch (e) {}
          }
          window.prompt(
            "아래 내용을 복사해서 카카오톡에 붙여넣기 해 주세요:",
            text
          );
        };

        // 종료 시 기록 저장 + 오늘 일일 미션 완료 시 팝업 띄우기
        useEffect(() => {
          if (!finished || total === 0) return;

          const record = {
            timestamp: Date.now(),
            total,
            correct,
            accuracy,
            avgTime,
            grade,
            timeLimitSec,
          };

          const records = saveRecord(record);
          let isNewBest = false;
          if (records) {
            const best = pickBestRecord(records);
            if (best && compareRecord(record, best) === 0) {
              isNewBest = true;
            }
          }
          setJustSetNewBest(isNewBest);

          if (onRecordsUpdated) {
            onRecordsUpdated();
          }

          // 오늘 미션 체크
          try {
            const allRecords = loadRecords();
            const info = calcTodayMissionAndAllowance(allRecords);
            const allDailyDone =
              info.dailyMissions &&
              info.dailyMissions.length > 0 &&
              info.dailyMissions.every((m) => m.done);

            if (allDailyDone) {
              const popupLines = [];
              popupLines.push("오늘 일일 미션을 모두 완료했어요! 🎉");
              popupLines.push("");
              popupLines.push("이번 타임어택 결과는 아래와 같아요.");
              popupLines.push(`- 모드: ${timeLimitSec}초`);
              popupLines.push(`- 정답: ${correct}/${total} (${accuracy})`);
              popupLines.push(`- 평균속도: ${avgTime}초`);
              popupLines.push(`- 등급: ${grade} 등급`);
              popupLines.push(`- 최고 콤보: ${bestCombo}콤보`);
              popupLines.push("");
              if (grade === "S" || grade === "A") {
                const money = grade === "S" ? 1000 : 500;
                popupLines.push(
                  `오늘은 ${grade} 등급이라서, 약속한 용돈 ${money.toLocaleString()}원 부탁드려요 😆`
                );
              } else {
                popupLines.push(
                  "오늘은 S/A는 아니지만, 그래도 열심히 했어요! 칭찬도 함께 부탁해요 😊"
                );
              }
              popupLines.push("");
              popupLines.push(
                "아래 [카카오톡 공유] 버튼을 누르면 이 내용이 자동으로 복사돼요."
              );
              setMissionPopupText(popupLines.join("\n"));
              setShowMissionPopup(true);
            }
          } catch (e) {
            // 무시
          }
        }, [finished]); // eslint-disable-line react-hooks/exhaustive-deps

        const isFever = combo >= 5;

        return (
          <>
            <div className={"question-box" + (isFever ? " fever" : "")}>
              {isFever && (
                <div className="fever-label">
                  FEVER 모드! 연속 정답 {combo}콤보 🔥
                </div>
              )}
              <div className="question-label">
                타임어택 모드 - {timeLimitSec}초 안에 최대한 많이!
              </div>

              <div className="timer" style={{ width: "100%" }}>
                <div className="time-bar">
                  <div
                    className="time-bar-inner"
                    style={{
                      width: `${progressPercent}%`,
                      background:
                        timeLeftMs < 10000
                          ? "linear-gradient(90deg, #ff6b6b, #ff9f43)"
                          : "linear-gradient(90deg, #00c9a7, #00a8ff)",
                    }}
                  />
                  <span className="time-bar-text">
                    남은 시간: {secondsLeft}초
                  </span>
                </div>
              </div>

              <div className="question" style={{ marginTop: 4 }}>
                {question.a} × {question.b} = ?
              </div>

              <div className="combo-row">
                <span className="combo-current">콤보: {combo} 🔁</span>
                <span className="combo-best">최고 콤보: {bestCombo}</span>
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                    disabled={!running}
                  >
                    {c}
                  </button>
                ))}
              </div>

              <div style={{ marginTop: 8, textAlign: "center" }}>
                <button
                  className="primary-button"
                  onClick={startGame}
                  style={{ padding: "6px 14px" }}
                >
                  {running ? "다시 시작" : "시작하기"}
                </button>
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {finished && (
              <>
                <div className="result ok">
                  타임어택 종료! 🎉
                  <br />
                  <b>{total}</b>문제 중 <b>{correct}</b>개 정답, 정답률{" "}
                  {accuracy},
                  <br />
                  평균 {avgTime === "-" ? "-" : `${avgTime}초`} / 등급 {grade} 등급!
                  <br />
                  최고 콤보 {bestCombo}콤보
                  {justSetNewBest && (
                    <>
                      <br />
                      ✨ 짱구도 박수칠 최고 기록 갱신!
                    </>
                  )}
                </div>
                <div className="share-row">
                  <button className="share-button" onClick={shareResult}>
                    결과 공유하기 (카카오톡 등)
                  </button>
                </div>
              </>
            )}

            {lastMessage && !finished && (
              <div className="result ok">{lastMessage}</div>
            )}

            <div className="small-tip">
              버튼만 톡톡 누르기만 해도 되는 스피드 모드! <br />
              오늘 S/A 등급을 노려서 용돈도 챙겨 보자 ✨
            </div>

            {showMissionPopup && (
              <div className="mission-popup-backdrop">
                <div className="mission-popup-card">
                  <div className="mission-popup-title">
                    오늘 미션 완료! 🎉
                  </div>
                  <div className="mission-popup-text">
                    {missionPopupText.split("\n").map((line, idx) => (
                      <React.Fragment key={idx}>
                        {line}
                        <br />
                      </React.Fragment>
                    ))}
                  </div>
                  <div className="mission-popup-buttons">
                    <button
                      className="mission-popup-btn primary"
                      onClick={handleMissionCopy}
                    >
                      카카오톡 공유 (자동 복사)
                    </button>
                    <button
                      className="mission-popup-btn secondary"
                      onClick={() => setShowMissionPopup(false)}
                    >
                      닫기
                    </button>
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      // ========= 기록 보기 탭 =========

        const [topRecords, setTopRecords] = useState([]);

                노란 별이 붙은 배지가 많아질수록, “구구런 마스터 유라”에

      // ========= 미션/용돈 탭 =========
      function MissionsView({ recordsVersion }) {
        const [info, setInfo] = useState(() =>
          calcTodayMissionAndAllowance(loadRecords())
        );

        useEffect(() => {
          const recs = loadRecords();
          setInfo(calcTodayMissionAndAllowance(recs));
        }, [recordsVersion]);

        const {
          todayStr,
          todayCountAll,
          todayCount60,
          todayCorrectSum,
          bestGrade,
          allowance,
          dailyMissions,
          weeklyMissions,
          weekRangeStr,
        } = info;

        const shareToday = async () => {
          const doneCount = dailyMissions.filter((m) => m.done).length;

          let allowanceLine = "";
          if (allowance > 0 && bestGrade !== "-") {
            allowanceLine = `오늘은 ${bestGrade} 등급이라서, 약속한 용돈 ${allowance.toLocaleString()}원 주세요 😆`;
          } else {
            allowanceLine =
              "오늘은 아직 S/A 등급은 아니지만, 구구단 연습 열심히 했어요! 칭찬도 부탁해요 😊";
          }

          const summary =
            `유라의 구구런 오늘 미션 보고!\n` +
            `- 오늘 날짜: ${todayStr}\n` +
            `- 일일 미션 완료: ${doneCount} / ${dailyMissions.length}개\n` +
            `- 오늘 최고 등급: ${
              bestGrade === "-" ? "없음" : bestGrade
            }\n` +
            `- 오늘 용돈: ${allowance.toLocaleString()}원\n\n` +
            allowanceLine;

          if (navigator.share) {
            try {
              await navigator.share({
                title: "유라의 구구런 - 오늘 미션 결과",
                text: summary,
                url: window.location.href,
              });
              return;
            } catch (e) {}
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(summary);
              alert(
                "오늘 미션/용돈 결과를 클립보드에 복사했어요.\n카카오톡을 열고 채팅창에 붙여넣기 해서 공유해 주세요!"
              );
              return;
            } catch (e) {}
          }

          window.prompt(
            "이 텍스트를 전체 선택(Ctrl+A) 후 복사해서 카카오톡에 붙여넣기 해 주세요:",
            summary
          );
        };

        return (
          <div>
            {/* 오늘의 일일 미션 */}
            <div className="records-box">
              <h3>오늘의 미션 (모두 타임어택으로 달성)</h3>

              {dailyMissions.length > 0 ? (
                <div className="mission-list">
                  {dailyMissions.map((m) => (
                    <div className="mission-item" key={m.id}>
                      <div className="mission-main">
                        <span className="mission-title">{m.title}</span>
                        <span
                          className={
                            "mission-status " + (m.done ? "done" : "pending")
                          }
                        >
                          {m.done ? "완료 🎉" : "진행중"}
                        </span>
                      </div>
                      <div className="mission-progress">{m.progress}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="small-tip">
                  아직 타임어택 기록이 없어요. 오늘 첫 미션을 시작해 보세요!
                </div>
              )}
            </div>

            {/* 주간 미션 */}
            <div className="records-box">
              <h3>주간 미션 (이번 주: {weekRangeStr})</h3>

              {weeklyMissions.length > 0 ? (
                <div className="mission-list">
                  {weeklyMissions.map((m) => (
                    <div className="mission-item" key={m.id}>
                      <div className="mission-main">
                        <span className="mission-title">{m.title}</span>
                        <span
                          className={
                            "mission-status " + (m.done ? "done" : "pending")
                          }
                        >
                          {m.done ? "완료 ✅" : "진행중"}
                        </span>
                      </div>
                      <div className="mission-progress">{m.progress}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="small-tip">
                  이번 주에는 아직 타임어택 기록이 없어요.
                </div>
              )}
            </div>

            {/* 오늘 용돈 정보 */}
            <div className="records-box">
              <h3>오늘의 용돈 등급</h3>
              <div className="mission-info-row">
                <span className="mission-label">· 오늘 최고 등급</span>
                <span className="mission-value">
                  {bestGrade === "-" ? "아직 없음" : bestGrade}
                </span>
              </div>
              <div className="mission-info-row">
                <span className="mission-label">
                  · 용돈 규칙 (하루 1회)
                </span>
                <span className="mission-value">
                  S: 1,000원 / A: 500원
                </span>
              </div>
              <div className="mission-info-row">
                <span className="mission-label">· 오늘 계산된 용돈</span>
                <span className="mission-value">
                  {allowance.toLocaleString()}원
                </span>
              </div>
              <div className="small-tip" style={{ marginTop: 4 }}>
                매일 자정이 지나면 새로운 하루로 다시 계산돼요. <br />
                이번 주 주간 미션은 월요일부터 일요일까지의 타임어택 기록만
                사용해서 계산합니다.
              </div>
              <div className="share-row">
                <button className="share-button" onClick={shareToday}>
                  오늘 결과 공유하기 (부모님께)
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ========= 전체 App =========
      function App() {
        const [mode, setMode] = useState("practice"); // 'practice' | 'timeAttack' | 'records' | 'missions'
        const [timeLimitMs, setTimeLimitMs] = useState(30000); // 기본 30초
        const [recordsVersion, setRecordsVersion] = useState(0);
        const [profile, setProfile] = useState(() =>
          calcProfileFromRecords(loadRecords())
        );

        const timeLimitSec = Math.round(timeLimitMs / 1000);

        const refreshProfile = () => {
          const recs = loadRecords();
          setProfile(calcProfileFromRecords(recs));
        };

        const handleRecordsUpdated = () => {
          setRecordsVersion((v) => v + 1);
          refreshProfile();
        };

        const xpPercent =
          profile.xpForNextLevel > 0
            ? Math.max(
                0,
                Math.min(
                  100,
                  Math.round(
                    (profile.xpInLevel / profile.xpForNextLevel) * 100
                  )
                )
              )
            : 0;

        return (
          <div className="app">
            <div className="title">유라의 구구런 GUGU RUN</div>
            <div className="subtitle">
              민트 하늘색 구구단 연습장 · 속도 + 정확도 둘 다 잡기
            </div>

            <div className="profile-row">
              <div className="profile-main">
                <span className="profile-title">{profile.title}</span>
                <span className="profile-level">
                  Lv.{profile.level} · 총 경험치 {profile.xp}
                </span>
              </div>
              <div className="xp-bar">
                <div
                  className="xp-bar-fill"
                  style={{ width: `${xpPercent}%` }}
                />
              </div>
              <div className="xp-text">
                다음 레벨까지{" "}
                {profile.xpForNextLevel - profile.xpInLevel}점 남음
              </div>
            </div>

            {/* 타임어택 시간 선택 */}
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                marginBottom: 4,
                gap: 6,
              }}
            >
              <span className="section-title">타임어택 시간 (연습용)</span>
              <div style={{ display: "flex", gap: 4 }}>
                <button
                  className={
                    "pill-chip" + (timeLimitSec === 30 ? " active" : "")
                  }
                  onClick={() => setTimeLimitMs(30000)}
                >
                  30초
                </button>
                <button
                  className={
                    "pill-chip" + (timeLimitSec === 60 ? " active" : "")
                  }
                  onClick={() => setTimeLimitMs(60000)}
                >
                  60초
                </button>
              </div>
            </div>

            {/* 탭 */}
            <div className="tab-row">
              <button
                className={"tab-btn" + (mode === "practice" ? " active" : "")}
                onClick={() => setMode("practice")}
              >
                연습
              </button>
              <button
                className={"tab-btn" + (mode === "timeAttack" ? " active" : "")}
                onClick={() => setMode("timeAttack")}
              >
                타임어택
              </button>
              <button
                className={"tab-btn" + (mode === "records" ? " active" : "")}
                onClick={() => setMode("records")}
              >
                기록 보기
              </button>
              <button
                className={"tab-btn" + (mode === "missions" ? " active" : "")}
                onClick={() => setMode("missions")}
              >
                미션·용돈
              </button>
            </div>

            {mode === "practice" && <PracticeMode />}
            {mode === "timeAttack" && (
              <TimeAttackMode
                timeLimitMs={timeLimitMs}
                onRecordsUpdated={handleRecordsUpdated}
              />
            )}
            {mode === "records" && (
              <RecordsView recordsVersion={recordsVersion} />
            )}
            {mode === "missions" && (
              <MissionsView recordsVersion={recordsVersion} />
            )}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
