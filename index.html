<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유라의 구구런 GUGU RUN - 구구단 타임어택 연습</title>
    <!-- 반응형 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #f8e9ff, #e3f2ff);
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .app {
        width: 100%;
        max-width: 480px;
        margin: 16px;
        padding: 24px 20px;
        border-radius: 24px;
        background: #ffffffcc;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      .title {
        text-align: center;
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: linear-gradient(90deg, #7f5dff, #ff6fb1);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 10px;
      }

      .question-box {
        margin: 16px 0;
        padding: 18px 12px;
        border-radius: 18px;
        background: #f4f0ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .question-label {
        font-size: 0.9rem;
        color: #777;
      }

      .question {
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .timer {
        font-size: 0.9rem;
        color: #8c68ff;
      }

      .stats {
        margin-top: 12px;
        padding: 12px 10px;
        border-radius: 16px;
        background: #f9fbff;
        font-size: 0.9rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 4px;
      }

      .stats span.label {
        color: #777;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 0.95rem;
      }

      .result.ok {
        background: #e8f9f1;
        color: #1c7c4e;
      }

      .result.bad {
        background: #ffeff0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #888;
        text-align: center;
      }

      .primary-button {
        padding: 10px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #8c68ff, #ff6fb1);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      /* 객관식 선택지 스타일 */
      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
        width: 100%;
      }

      .choice-btn {
        padding: 10px 0;
        border-radius: 12px;
        border: none;
        background: #ffffff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .choice-btn:active {
        transform: translateY(1px);
      }

      .choice-btn.correct-hint {
        background: #e8f9f1;
      }

      .section-title {
        font-size: 0.8rem;
        color: #666;
      }

      .difficulty-chip {
        padding: 4px 8px;
        border-radius: 999px;
        border: none;
        font-size: 0.8rem;
        cursor: pointer;
        background: #eee;
        color: #555;
      }

      .difficulty-chip.active {
        background: #8c68ff;
        color: #fff;
      }

      .best-record {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #fff7e6;
        font-size: 0.8rem;
        color: #8a5a00;
      }

      .share-row {
        margin-top: 8px;
        text-align: center;
      }

      .share-button {
        padding: 8px 12px;
        border-radius: 12px;
        border: none;
        background: #00c73c; /* 카카오톡 느낌은 아니지만, 초록 톤 */
        color: white;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }

      .share-button:active {
        transform: translateY(1px);
      }

      @media (max-width: 480px) {
        .question {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM & Babel (개발용) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 코드 -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function getRandomQuestion() {
        const a = Math.floor(Math.random() * 8) + 2; // 2~9
        const b = Math.floor(Math.random() * 9) + 1; // 1~9
        return { a, b };
      }

      // 전체 구구단 결과 중 랜덤 하나
      function getRandomProduct() {
        const a = Math.floor(Math.random() * 8) + 2;
        const b = Math.floor(Math.random() * 9) + 1;
        return a * b;
      }

      // 정답 + 오답 여러 개 = 총 6개 보기
      function getChoices(correct, difficulty) {
        const set = new Set();
        set.add(correct);

        // 난이도 'near': 정답 근처 숫자, 'random': 전체 곱셈 결과 중 랜덤
        while (set.size < 6) {
          let candidate;
          if (difficulty === "random") {
            candidate = getRandomProduct();
          } else {
            const delta = Math.floor(Math.random() * 9) - 4; // -4 ~ +4
            if (delta === 0) continue;
            candidate = correct + delta;
            if (candidate <= 0) continue;
          }
          set.add(candidate);
        }

        return Array.from(set).sort(() => Math.random() - 0.5); // 섞기
      }

      // 바로 직전 문제와 같지 않도록 보장
      function getQuestionWithChoices(prevQuestion, difficulty) {
        let base;
        do {
          base = getRandomQuestion();
        } while (
          prevQuestion &&
          base.a === prevQuestion.a &&
          base.b === prevQuestion.b
        );

        const correct = base.a * base.b;
        return {
          ...base,
          choices: getChoices(correct, difficulty),
        };
      }

      // ===== 로컬스토리지 유틸 =====
      const STORAGE_KEY = "gugurun_timeattack_records";

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch (e) {
          return [];
        }
      }

      function saveRecord(record) {
        try {
          const records = loadRecords();
          records.push(record);
          // 너무 길어지는 것 방지: 최근 200개까지만 저장
          const trimmed = records.slice(-200);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
          return trimmed;
        } catch (e) {
          return null;
        }
      }

      function pickBestRecord(records) {
        if (!records || records.length === 0) return null;
        // 기준: correct ↓, total ↓, avgTime ↑ 작은 순
        return records.reduce((best, cur) => {
          if (!best) return cur;
          if (cur.correct > best.correct) return cur;
          if (cur.correct < best.correct) return best;
          if (cur.total > best.total) return cur;
          if (cur.total < best.total) return best;
          const a = parseFloat(cur.avgTime || "999");
          const b = parseFloat(best.avgTime || "999");
          if (!isNaN(a) && !isNaN(b) && a < b) return cur;
          return best;
        }, null);
      }

      // ========= 연습 모드 =========
      function PracticeMode({ difficulty }) {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null, difficulty)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [lastCorrect, setLastCorrect] = useState(null);
        const [lastMessage, setLastMessage] = useState("");
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);

        // 난이도 바뀌면 새 문제로 리셋
        useEffect(() => {
          setQuestion((prev) => getQuestionWithChoices(prev, difficulty));
        }, [difficulty]);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastCorrect(true);
            setLastMessage(
              `정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastCorrect(false);
            setLastMessage(
              `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(
                2
              )}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev, difficulty));
        };

        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                연습 모드 - 객관식 스피드 연습
              </div>
              <div className="question">
                {question.a} × {question.b} = ?
              </div>
              <div className="timer">
                문제 보인 지{" "}
                {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="stats">
              <span className="label">총 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {lastMessage && (
              <div className={`result ${lastCorrect ? "ok" : "bad"}`}>
                {lastMessage}
              </div>
            )}

            <div className="small-tip">
              답을 <b>직접 누르기만</b> 하면 되도록 바꾼 연습 모드입니다. <br />
              난이도 버튼으로 보기 패턴을 바꾸면서 감각을 올려보세요.
            </div>
          </>
        );
      }

      // ========= 타임어택 모드 =========
      function TimeAttackMode({ difficulty }) {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null, difficulty)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [running, setRunning] = useState(false);
        const [timeLeftMs, setTimeLeftMs] = useState(60000); // 60초
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [lastMessage, setLastMessage] = useState("");
        const [finished, setFinished] = useState(false);
        const [bestRecord, setBestRecord] = useState(null);
        const [justSetNewBest, setJustSetNewBest] = useState(false);
        const timerRef = useRef(null);

        // 난이도 변경 시 문제 리셋 (진행 중이면 그냥 새 문제로)
        useEffect(() => {
          setQuestion((prev) => getQuestionWithChoices(prev, difficulty));
          setQuestionStart(Date.now());
        }, [difficulty]);

        // 최초 로드 시 기존 기록 불러오기
        useEffect(() => {
          try {
            const records = loadRecords();
            const best = pickBestRecord(records);
            setBestRecord(best);
          } catch (e) {
            // 무시
          }
        }, []);

        const startGame = () => {
          setRunning(true);
          setFinished(false);
          setTimeLeftMs(60000);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setJustSetNewBest(false);
          setQuestion((prev) => getQuestionWithChoices(prev, difficulty));
          setQuestionStart(Date.now());
        };

        useEffect(() => {
          if (!running) {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
            return;
          }

          timerRef.current = setInterval(() => {
            setTimeLeftMs((prev) => {
              const next = prev - 100;
              if (next <= 0) {
                clearInterval(timerRef.current);
                timerRef.current = null;
                setRunning(false);
                setFinished(true);
                return 0;
              }
              return next;
            });
          }, 100);

          return () => {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [running]);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          if (!running) return;

          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev, difficulty));
        };

        const secondsLeft = (timeLeftMs / 1000).toFixed(1);
        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        let grade = "-";
        if (avgTime !== "-" && total > 0) {
          const t = parseFloat(avgTime);
          if (t < 1.5) grade = "S";
          else if (t < 2.5) grade = "A";
          else if (t < 3.5) grade = "B";
          else grade = "C";
        }

        // 타임어택이 끝났을 때 기록 저장
        useEffect(() => {
          if (!finished || total === 0) return;

          const record = {
            timestamp: Date.now(),
            total,
            correct,
            accuracy,
            avgTime,
            grade,
          };

          const records = saveRecord(record);
          if (!records) return;
          const best = pickBestRecord(records);
          if (best) {
            // 직전 best와 비교해서 새 기록인지 체크
            const before = bestRecord;
            setBestRecord(best);

            if (!before || best === record) {
              setJustSetNewBest(true);
            } else {
              // 비교 로직을 다시 한번 (보수적으로)
              const prevBest = before;
              let isNew = false;
              if (record.correct > prevBest.correct) isNew = true;
              else if (
                record.correct === prevBest.correct &&
                record.total > prevBest.total
              )
                isNew = true;
              else if (
                record.correct === prevBest.correct &&
                record.total === prevBest.total
              ) {
                const a = parseFloat(record.avgTime || "999");
                const b = parseFloat(prevBest.avgTime || "999");
                if (!isNaN(a) && !isNaN(b) && a < b) isNew = true;
              }

              if (isNew) setJustSetNewBest(true);
            }
          }
        }, [finished]); // eslint-disable-line react-hooks/exhaustive-deps

        const shareResult = async () => {
          const summary =
            `유라의 구구런 타임어택 결과\n` +
            `정답: ${correct}/${total} (${accuracy})\n` +
            `평균 반응속도: ${avgTime}초\n` +
            `등급: ${grade}\n` +
            `- from 유라의 구구런 GUGU RUN`;

          // Web Share API가 있는 경우 (iOS/안드 안드로이드 최신 브라우저)
          if (navigator.share) {
            try {
              await navigator.share({
                title: "유라의 구구런 GUGU RUN",
                text: summary,
                url: window.location.href,
              });
              return;
            } catch (e) {
              // 사용자가 취소한 경우 등은 무시
            }
          }

          // 공유가 안 되면 클립보드 복사
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(summary);
              alert(
                "타임어택 결과를 클립보드에 복사했어요.\n카카오톡을 열고 채팅창에 붙여넣기 해서 공유해 주세요!"
              );
              return;
            } catch (e) {
              // 무시 후 fallback
            }
          }

          // 최후 fallback: prompt로 보여주기
          window.prompt(
            "이 텍스트를 전체 선택(Ctrl+A) 후 복사해서 카카오톡에 붙여넣기 해 주세요:",
            summary
          );
        };

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                타임어택 모드 - 60초 안에 최대한 많이!
              </div>

              <div className="timer">
                남은 시간:{" "}
                <b style={{ color: timeLeftMs < 10000 ? "#c62828" : "#8c68ff" }}>
                  {secondsLeft}초
                </b>
              </div>

              <div className="question" style={{ marginTop: 8 }}>
                {question.a} × {question.b} = ?
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                    disabled={!running}
                  >
                    {c}
                  </button>
                ))}
              </div>

              <div style={{ marginTop: 12, textAlign: "center" }}>
                <button
                  className="primary-button"
                  onClick={startGame}
                  style={{ padding: "8px 18px" }}
                >
                  {running ? "다시 시작" : "시작하기"}
                </button>
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {finished && (
              <>
                <div className="result ok">
                  타임어택 종료! 🎉
                  <br />
                  <b>{total}</b>문제 중 <b>{correct}</b>개 정답, 정답률{" "}
                  {accuracy},{" "}
                  <br />
                  평균 {avgTime === "-" ? "-" : `${avgTime}초`} / 등급 {grade} 등급!
                  {justSetNewBest && (
                    <>
                      <br />
                      ✨ 최고 기록 갱신! 대단해요!
                    </>
                  )}
                </div>
                <div className="share-row">
                  <button className="share-button" onClick={shareResult}>
                    결과 공유하기 (카카오톡 등)
                  </button>
                </div>
              </>
            )}

            {lastMessage && !finished && (
              <div className="result ok">{lastMessage}</div>
            )}

            {bestRecord && (
              <div className="best-record">
                이 기기의 최고 기록:{" "}
                <b>
                  {bestRecord.correct}/{bestRecord.total}
                </b>{" "}
                정답, 정답률 {bestRecord.accuracy}, 평균{" "}
                {bestRecord.avgTime}초, 등급 {bestRecord.grade}
              </div>
            )}

            <div className="small-tip">
              객관식 버튼만 탭해서 <b>초스피드로</b> 푸는 모드입니다. <br />
              타임어택 결과는 이 기기에 저장돼서 최고 기록을 계속 갱신할 수 있어요.
            </div>
          </>
        );
      }

      // ========= 전체 App =========
      function App() {
        const [mode, setMode] = useState("practice"); // 'practice' | 'timeAttack'
        const [difficulty, setDifficulty] = useState("near"); // 'near' | 'random'

        return (
          <div className="app">
            <div className="title">유라의 구구런 GUGU RUN</div>
            <div className="subtitle">구구단 스피드 & 타임어택 연습</div>

            {/* 난이도 선택 */}
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                marginBottom: 8,
                gap: 8,
              }}
            >
              <span className="section-title">보기 난이도</span>
              <div style={{ display: "flex", gap: 6 }}>
                <button
                  className={
                    "difficulty-chip" +
                    (difficulty === "near" ? " active" : "")
                  }
                  onClick={() => setDifficulty("near")}
                >
                  비슷한 숫자
                </button>
                <button
                  className={
                    "difficulty-chip" +
                    (difficulty === "random" ? " active" : "")
                  }
                  onClick={() => setDifficulty("random")}
                >
                  완전 랜덤
                </button>
              </div>
            </div>

            {/* 모드 선택 */}
            <div
              style={{
                display: "flex",
                gap: 8,
                marginTop: 4,
                marginBottom: 8,
              }}
            >
              <button
                className="primary-button"
                style={{
                  flex: 1,
                  opacity: mode === "practice" ? 1 : 0.5,
                }}
                onClick={() => setMode("practice")}
              >
                연습 모드
              </button>
              <button
                className="primary-button"
                style={{
                  flex: 1,
                  opacity: mode === "timeAttack" ? 1 : 0.5,
                }}
                onClick={() => setMode("timeAttack")}
              >
                타임어택 모드
              </button>
            </div>

            {mode === "practice" ? (
              <PracticeMode difficulty={difficulty} />
            ) : (
              <TimeAttackMode difficulty={difficulty} />
            )}
          </div>
        );
      }

      // React 18 호환용, 개발용 CDN이라 ReactDOM.render로 단순하게
      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
