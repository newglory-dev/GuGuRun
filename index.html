<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유라의 구구런 GUGU RUN - 구구단 타임어택 연습</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #e3f8ff, #f0ffff);
        color: #333;
      }

      .app {
        max-width: 480px;
        margin: 8px auto;
        padding: 16px 14px 18px;
        border-radius: 22px;
        background: #ffffffee;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      .title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 2px;
        background: linear-gradient(90deg, #16c7c0, #2d8bff);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 10px;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .level-card {
        flex: 1;
        padding: 8px 10px 10px;
        border-radius: 16px;
        background: #e1f9ff;
        border: 1px solid #b9ecff;
      }

      .level-top {
        display: flex;
        justify-content: space-between;
        font-size: 0.83rem;
        margin-bottom: 4px;
      }

      .level-name {
        font-weight: 700;
      }

      .level-info {
        font-weight: 600;
        color: #0077aa;
      }

      .level-bar-wrap {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #c6f3ff;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .level-bar-inner {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #16c7c0, #2d8bff);
        transition: width 0.3s ease;
      }

      .level-bottom {
        font-size: 0.75rem;
        color: #555;
        text-align: right;
      }

      .settings-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: #d8f4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .settings-btn span {
        font-size: 1.2rem;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 10px;
      }

      .tab-btn {
        padding: 7px 0;
        border-radius: 999px;
        border: none;
        background: #e3f6ff;
        font-size: 0.78rem;
        cursor: pointer;
      }

      .tab-btn.active {
        background: linear-gradient(90deg, #16c7c0, #2d8bff);
        color: #fff;
        font-weight: 600;
      }

      .question-box {
        margin: 8px 0 12px;
        padding: 16px 12px 14px;
        border-radius: 18px;
        background: #f4fbff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .question-label {
        font-size: 0.85rem;
        color: #777;
      }

      .top-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 4px;
      }

      .timer-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .time-bar-wrap {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: #dff4ff;
        overflow: hidden;
      }

      .time-bar-inner {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #16c7c0, #2d8bff);
        transition: width 0.1s linear;
      }

      .timer-row span {
        font-size: 0.8rem;
        min-width: 42px;
        text-align: right;
        color: #555;
      }

      .question {
        font-size: 2.3rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-top: 2px;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
        width: 100%;
      }

      .choice-btn {
        padding: 9px 0;
        border-radius: 12px;
        border: none;
        background: #ffffff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
      }

      .choice-btn:active {
        transform: translateY(1px);
      }

      .subject-input-wrap {
        margin-top: 10px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
      }

      .subject-input-display {
        width: 100%;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid #c9ecff;
        background: #ffffff;
        font-size: 1.3rem;
        font-weight: 700;
        text-align: center;
        min-height: 44px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subject-input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 12px;
        border: 1px solid #c9ecff;
        font-size: 1.4rem;
        text-align: center;
      }

      .subject-input:focus {
        outline: none;
        border-color: #16c7c0;
        box-shadow: 0 0 0 2px #b7f2ff;
      }

      .keypad {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .key-btn {
        padding: 8px 0;
        border-radius: 10px;
        border: none;
        background: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
        cursor: pointer;
      }

      .key-btn.special {
        background: #e3f6ff;
        font-size: 0.92rem;
      }

      .primary-button {
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #16c7c0, #2d8bff);
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      .center-row {
        margin-top: 8px;
        text-align: center;
      }

      .stats {
        margin-top: 8px;
        padding: 10px 10px;
        border-radius: 16px;
        background: #f8fdff;
        font-size: 0.85rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 4px;
      }

      .stats span.label {
        color: #777;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 8px;
        padding: 10px 10px;
        border-radius: 12px;
        font-size: 0.9rem;
      }

      .result.ok {
        background: #e8f9f1;
        color: #1c7c4e;
      }

      .result.bad {
        background: #ffeff0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 6px;
        font-size: 0.8rem;
        color: #777;
        text-align: center;
      }

      .section-card {
        margin-top: 6px;
        padding: 10px 10px 8px;
        border-radius: 16px;
        background: #f5fcff;
        border: 1px solid #d6f0ff;
        font-size: 0.82rem;
      }

      .section-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .section-title {
        font-weight: 700;
        font-size: 0.86rem;
      }

      .mission-list {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .mission-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .mission-main {
        font-weight: 500;
      }

      .mission-sub {
        font-size: 0.78rem;
        color: #777;
      }

      .mission-status {
        font-size: 0.78rem;
        font-weight: 700;
      }

      .mission-status.done {
        color: #1c7c4e;
      }

      .mission-status.doing {
        color: #0077aa;
      }

      .records-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
        margin-top: 4px;
      }

      .records-table th,
      .records-table td {
        padding: 3px 4px;
        text-align: center;
        border-bottom: 1px solid #e1f0ff;
      }

      .records-table th {
        background: #e8f7ff;
        font-weight: 700;
      }

      .highlight-row {
        font-weight: 600;
      }

      .mission-popup-overlay,
      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .mission-popup,
      .settings-modal {
        width: min(90%, 360px);
        background: #ffffff;
        border-radius: 16px;
        padding: 14px 14px 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: 0.85rem;
      }

      .mission-popup-title {
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }

      .mission-popup-body {
        white-space: pre-line;
        margin-bottom: 10px;
        line-height: 1.4;
      }

      .mission-popup-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .secondary-button {
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid #cdefff;
        background: #f5fcff;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .secondary-button:active {
        transform: translateY(1px);
      }

      .copy-hint {
        margin-top: 2px;
        font-size: 0.7rem;
        color: #777;
      }

      .settings-modal-title {
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 8px;
      }

      .settings-panel {
        font-size: 0.8rem;
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .settings-row label {
        font-weight: 600;
        color: #333;
      }

      .settings-options {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .settings-chip {
        border-radius: 999px;
        border: 1px solid #aee5ff;
        padding: 3px 8px;
        font-size: 0.78rem;
        cursor: pointer;
        background: #ffffff;
      }

      .settings-chip.active {
        background: linear-gradient(90deg, #16c7c0, #2d8bff);
        color: white;
        border-color: transparent;
        font-weight: 600;
      }

      .settings-footer {
        margin-top: 8px;
        text-align: right;
      }

      /* ==== 정답/오답 이펙트 ==== */
      .effect-burst {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9000;
        animation: burst-pop 0.45s ease-out forwards;
      }

      .effect-burst.correct {
        background: radial-gradient(
          circle at center,
          rgba(0, 255, 170, 0.35),
          transparent 70%
        );
      }

      .effect-burst.wrong {
        background: radial-gradient(
          circle at center,
          rgba(255, 80, 80, 0.3),
          transparent 70%
        );
      }

      @keyframes burst-pop {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        40% {
          transform: scale(1.03);
          opacity: 1;
        }
        100% {
          transform: scale(1.1);
          opacity: 0;
        }
      }

      .shake {
        animation: shake-anim 0.35s ease;
      }

      @keyframes shake-anim {
        0% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-4px);
        }
        40% {
          transform: translateX(4px);
        }
        60% {
          transform: translateX(-3px);
        }
        80% {
          transform: translateX(3px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @media (max-width: 480px) {
        .question {
          font-size: 2.05rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM & Babel -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      /* ========= 소리 이펙트 (Web Audio API) ========= */
      let sharedAudioContext = null;
      function getAudioContext() {
        try {
          if (!sharedAudioContext) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            sharedAudioContext = new AC();
          }
          return sharedAudioContext;
        } catch {
          return null;
        }
      }

      function playBeep({ frequency = 880, duration = 0.12, type = "sine" }) {
        const audioCtx = getAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.value = 0.25;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        osc.start(now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.stop(now + duration + 0.02);
      }

      function playCorrectSound() {
        // 밝은 2단계 비프
        playBeep({ frequency: 1046, duration: 0.09, type: "sine" }); // 높은 도
        setTimeout(() => {
          playBeep({ frequency: 1318, duration: 0.09, type: "sine" }); // 높은 미
        }, 90);
      }

      function playWrongSound() {
        // 낮은 "부웅" 느낌
        const audioCtx = getAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(
          120,
          audioCtx.currentTime + 0.18
        );

        gain.gain.value = 0.22;
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.start(now);
        osc.stop(now + 0.25);
      }

      const STORAGE_KEY_PROFILE = "gugurun_profile_v2";
      const STORAGE_KEY_RECORDS = "gugurun_records_v2";
      const STORAGE_KEY_SETTINGS = "gugurun_settings_v1";

      function todayYMD() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getWeekInfo(dateObj = new Date()) {
        const d = new Date(
          dateObj.getFullYear(),
          dateObj.getMonth(),
          dateObj.getDate()
        );
        const day = d.getDay();
        const diffToMonday = (day + 6) % 7;
        const monday = new Date(d);
        monday.setDate(d.getDate() - diffToMonday);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const fmt = (x) =>
          `${x.getFullYear()}.${String(x.getMonth() + 1).padStart(
            2,
            "0"
          )}.${String(x.getDate()).padStart(2, "0")}`;

        return {
          monday,
          sunday,
          label: `${fmt(monday)} ~ ${fmt(sunday)}`,
        };
      }

      function gradePriority(g) {
        if (g === "S") return 4;
        if (g === "A") return 3;
        if (g === "B") return 2;
        if (g === "C") return 1;
        return 0;
      }

      // ===== 레벨/경험치 =====
      const MAX_LEVEL = 50;

      function xpNeededForLevelUp(level) {
        return 300 + (level - 1) * 100;
      }

      function calcLevelFromXp(totalXp) {
        let level = 1;
        let xp = Math.max(0, totalXp || 0);
        let need = xpNeededForLevelUp(level);

        while (level < MAX_LEVEL && xp >= need) {
          xp -= need;
          level += 1;
          if (level < MAX_LEVEL) {
            need = xpNeededForLevelUp(level);
          } else {
            need = 0;
          }
        }
        const xpInLevel = xp;
        const xpToNext = level === MAX_LEVEL ? 0 : need;
        return { level, xpInLevel, xpToNext };
      }

      function getTitleForLevel(level) {
        if (level >= 46) return "완전체 유라";
        if (level >= 41) return "전설 유라";
        if (level >= 36) return "초월자 유라";
        if (level >= 31) return "마스터 유라";
        if (level >= 26) return "스피드 스타 유라";
        if (level >= 21) return "계산 요정 유라";
        if (level >= 16) return "천재 유라";
        if (level >= 11) return "반장 유라";
        if (level >= 6) return "성장 유라";
        return "새싹 유라";
      }

      function loadProfile() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_PROFILE);
          if (!raw) return { totalXp: 0 };
          return JSON.parse(raw);
        } catch {
          return { totalXp: 0 };
        }
      }

      function saveProfile(profile) {
        try {
          localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
        } catch {}
      }

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_RECORDS);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          return arr;
        } catch {
          return [];
        }
      }

      function saveRecords(records) {
        try {
          localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
        } catch {}
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_SETTINGS);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function saveSettings(settings) {
        try {
          localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        } catch {}
      }

      // ===== 문제 생성 =====
      function getRandomQuestion(excludeOneTimes) {
        const a = Math.floor(Math.random() * 8) + 2; // 2~9
        let b;
        if (excludeOneTimes) {
          b = Math.floor(Math.random() * 8) + 2; // 2~9, ×1 제외
        } else {
          b = Math.floor(Math.random() * 9) + 1; // 1~9
        }
        return { a, b };
      }

      function getChoices(correct) {
        const set = new Set();
        set.add(correct);

        while (set.size < 6) {
          const delta = Math.floor(Math.random() * 9) - 4;
          if (delta === 0) continue;
          const candidate = correct + delta;
          if (candidate <= 0) continue;
          set.add(candidate);
        }

        return Array.from(set).sort(() => Math.random() - 0.5);
      }

      function getQuestionWithChoices(prev, excludeOneTimes) {
        let base;
        do {
          base = getRandomQuestion(excludeOneTimes);
        } while (prev && base.a === prev.a && base.b === prev.b);
        const correct = base.a * base.b;
        return { ...base, choices: getChoices(correct) };
      }

      // ===== 연습 모드 =====
      function PracticeMode() {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null, false)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [lastCorrect, setLastCorrect] = useState(null);
        const [lastMessage, setLastMessage] = useState("");
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [effect, setEffect] = useState(null);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        useEffect(() => {
          if (!effect) return;
          const t = setTimeout(() => setEffect(null), 450);
          return () => clearTimeout(t);
        }, [effect]);

        const handleChoice = (choice) => {
          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastCorrect(true);
            setLastMessage(
              `정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`
            );
            setEffect("correct");
            playCorrectSound();
          } else {
            setLastCorrect(false);
            setLastMessage(
              `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(
                2
              )}초)`
            );
            setEffect("wrong");
            playWrongSound();
          }

          setQuestion((prev) => getQuestionWithChoices(prev, false));
        };

        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        return (
          <>
            {effect && <div className={`effect-burst ${effect}`}></div>}

            <div
              className={
                "question-box" + (effect === "wrong" ? " shake" : "")
              }
            >
              <div className="question-label">연습 모드 - 객관식 스피드 연습</div>
              <div className="question">
                {question.a} × {question.b} = ?
              </div>
              <div className="timer">
                문제 보인 지{" "}
                {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">정답 속도(평균)</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {lastMessage && (
              <div className={`result ${lastCorrect ? "ok" : "bad"}`}>
                {lastMessage}
              </div>
            )}

            <div className="small-tip">
              연습 모드는 가볍게 손풀기용이에요. 타임어택 기록에는 영향을 주지
              않습니다.
            </div>
          </>
        );
      }

      // ===== 타임어택 모드 =====
      function TimeAttackMode({
        timeLimitSec,
        answerType,
        keyboardMode,
        onGameFinished,
      }) {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null, true)
        );
        const [running, setRunning] = useState(false);
        const [timeLeftMs, setTimeLeftMs] = useState(timeLimitSec * 1000);
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTimeAll, setSumTimeAll] = useState(0);
        const [lastMessage, setLastMessage] = useState("");
        const [finishedSummary, setFinishedSummary] = useState(null);
        const timerRef = useRef(null);

        const gameStartRef = useRef(null);
        const gameEndRef = useRef(null);
        const correctTimesRef = useRef([]);
        const lastAnswerTimeRef = useRef(null);
        const totalRef = useRef(0);
        const correctRef = useRef(0);

        const [inputValue, setInputValue] = useState("");
        const [effect, setEffect] = useState(null);

        useEffect(() => {
          setTimeLeftMs(timeLimitSec * 1000);
        }, [timeLimitSec]);

        useEffect(() => {
          if (!effect) return;
          const t = setTimeout(() => setEffect(null), 450);
          return () => clearTimeout(t);
        }, [effect]);

        const resetState = () => {
          setQuestion((prev) => getQuestionWithChoices(null, true));
          setTimeLeftMs(timeLimitSec * 1000);
          setTotal(0);
          setCorrect(0);
          setSumTimeAll(0);
          setLastMessage("");
          setFinishedSummary(null);
          setInputValue("");
          correctTimesRef.current = [];
          gameStartRef.current = null;
          gameEndRef.current = null;
          lastAnswerTimeRef.current = null;
          totalRef.current = 0;
          correctRef.current = 0;
          setEffect(null);
        };

        const startGame = () => {
          if (timerRef.current) {
            clearInterval(timerRef.current);
            timerRef.current = null;
          }
          resetState();
          setRunning(true);
          const now = Date.now();
          gameStartRef.current = now;
          lastAnswerTimeRef.current = now;

          const audioCtx = getAudioContext();
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }

          timerRef.current = setInterval(() => {
            setTimeLeftMs((prev) => {
              const next = prev - 100;
              if (next <= 0) {
                clearInterval(timerRef.current);
                timerRef.current = null;
                const endTime = Date.now();
                setRunning(false);
                gameEndRef.current = endTime;
                finalizeGame(endTime);
                return 0;
              }
              return next;
            });
          }, 100);
        };

        useEffect(() => {
          return () => {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
          };
        }, []);

        const secondsLeft = (timeLeftMs / 1000).toFixed(1);

        const handleObjectiveChoice = (choice) => {
          if (!running) return;
          const now = Date.now();
          const elapsed = (now - lastAnswerTimeRef.current) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          totalRef.current += 1;
          setSumTimeAll((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            correctRef.current += 1;
            correctTimesRef.current.push(now);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setEffect("correct");
            playCorrectSound();
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setEffect("wrong");
            playWrongSound();
          }

          lastAnswerTimeRef.current = now;
          setQuestion((prev) => getQuestionWithChoices(prev, true));
        };

        const submitSubjective = () => {
          if (!running) return;
          if (!inputValue || inputValue.trim() === "") return;
          const valueNum = parseInt(inputValue, 10);
          if (Number.isNaN(valueNum)) return;

          const now = Date.now();
          const elapsed = (now - lastAnswerTimeRef.current) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          totalRef.current += 1;
          setSumTimeAll((s) => s + elapsed);

          if (valueNum === correctAnswer) {
            setCorrect((c) => c + 1);
            correctRef.current += 1;
            correctTimesRef.current.push(now);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setEffect("correct");
            playCorrectSound();
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
            setEffect("wrong");
            playWrongSound();
          }

          lastAnswerTimeRef.current = now;
          setInputValue("");
          setQuestion((prev) => getQuestionWithChoices(prev, true));
        };

        const handleSystemInputKeyDown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitSubjective();
          }
        };

        const handleKeypadPress = (key) => {
          if (key === "삭제") {
            setInputValue((prev) => prev.slice(0, -1));
          } else if (key === "입력") {
            submitSubjective();
          } else {
            setInputValue((prev) => {
              if (prev.length >= 3) return prev;
              return prev + key;
            });
          }
        };

        const finalizeGame = (endTime) => {
          const totalQ = totalRef.current;
          const correctQ = correctRef.current;
          const wrongQ = totalQ - correctQ;

          const durationSec = timeLimitSec;
          const accuracy = totalQ > 0 ? correctQ / totalQ : 0;

          const avgAll =
            totalQ > 0 ? (sumTimeAll / Math.max(totalQ, 1)).toFixed(2) : "-";

          let avgCorrectSpeedSec = "-";
          const correctTimes = correctTimesRef.current;
          if (correctTimes.length > 0 && gameStartRef.current) {
            const start = gameStartRef.current;
            const end = endTime;
            const intervals = [];
            let prev = start;
            for (let i = 0; i < correctTimes.length; i++) {
              const t = correctTimes[i];
              intervals.push(t - prev);
              prev = t;
            }
            intervals[intervals.length - 1] +=
              end - correctTimes[correctTimes.length - 1];

            const WARMUP_CORRECTS = 3;
            const gradedIntervals =
              intervals.length > WARMUP_CORRECTS
                ? intervals.slice(WARMUP_CORRECTS)
                : [];

            if (gradedIntervals.length > 0) {
              const sum = gradedIntervals.reduce((a, b) => a + b, 0);
              avgCorrectSpeedSec = (sum / gradedIntervals.length / 1000).toFixed(
                2
              );
            } else {
              avgCorrectSpeedSec = "-";
            }
          }

          const effectiveAvgSec =
            avgCorrectSpeedSec === "-" ? null : parseFloat(avgCorrectSpeedSec);
          let score = 0;
          if (effectiveAvgSec && correctQ > 0) {
            score = Math.round(
              (correctQ * accuracy * 100) / (effectiveAvgSec * 0.7 + 0.3)
            );
          }

          let grade = "-";
          if (effectiveAvgSec && correctQ > 0) {
            const minCorrectForS = 15;
            const minCorrectForA = 10;
            const minAccuracyForS = 0.9;
            const minAccuracyForA = 0.8;

            if (
              effectiveAvgSec < 2.0 &&
              correctQ >= minCorrectForS &&
              accuracy >= minAccuracyForS
            ) {
              grade = "S";
            } else if (
              effectiveAvgSec < 3.0 &&
              correctQ >= minCorrectForA &&
              accuracy >= minAccuracyForA
            ) {
              grade = "A";
            } else if (effectiveAvgSec < 4.0) {
              grade = "B";
            } else {
              grade = "C";
            }
          }

          const result = {
            date: todayYMD(),
            durationSec,
            total: totalQ,
            correct: correctQ,
            wrong: wrongQ,
            accuracy,
            avgAllSec: avgAll === "-" ? null : parseFloat(avgAll),
            avgCorrectSpeedSec:
              avgCorrectSpeedSec === "-"
                ? null
                : parseFloat(avgCorrectSpeedSec),
            grade,
            score,
          };

          setFinishedSummary(result);
          if (onGameFinished) onGameFinished(result);
        };

        const timeRatio = timeLeftMs / (timeLimitSec * 1000);
        const timeBarWidth = `${Math.max(0, Math.min(1, timeRatio)) * 100}%`;

        const avgCorrectSpeedDisplay =
          finishedSummary && finishedSummary.avgCorrectSpeedSec != null
            ? `${finishedSummary.avgCorrectSpeedSec.toFixed(2)}초`
            : "-";

        const accuracyPercent =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        return (
          <>
            {effect && <div className={`effect-burst ${effect}`}></div>}

            <div
              className={
                "question-box" + (effect === "wrong" ? " shake" : "")
              }
            >
              <div className="question-label">
                타임어택 모드 - {timeLimitSec}초 안에 최대한 많이!
              </div>

              <div className="top-row">
                <div className="timer-row">
                  <div className="time-bar-wrap">
                    <div
                      className="time-bar-inner"
                      style={{ width: timeBarWidth }}
                    ></div>
                  </div>
                  <span>{secondsLeft}초</span>
                </div>
              </div>

              <div className="question">
                {question.a} × {question.b} = ?
              </div>

              {answerType === "choice" ? (
                <div className="choices">
                  {question.choices.map((c) => (
                    <button
                      key={c}
                      className="choice-btn"
                      onClick={() => handleObjectiveChoice(c)}
                      disabled={!running}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              ) : (
                <div className="subject-input-wrap">
                  {keyboardMode === "system" ? (
                    <>
                      <input
                        className="subject-input"
                        type="tel"
                        placeholder="정답을 숫자로 입력 후 엔터"
                        value={inputValue}
                        onChange={(e) => setInputValue(e.target.value)}
                        onKeyDown={handleSystemInputKeyDown}
                        disabled={!running}
                      />
                    </>
                  ) : (
                    <>
                      <div className="subject-input-display">
                        {inputValue || "숫자를 눌러서 입력"}
                      </div>
                      <div className="keypad">
                        {[
                          "1",
                          "2",
                          "3",
                          "삭제",
                          "4",
                          "5",
                          "6",
                          "입력",
                          "7",
                          "8",
                          "9",
                          "0",
                        ].map((key) => (
                          <button
                            key={key}
                            className={
                              key === "삭제" || key === "입력"
                                ? "key-btn special"
                                : "key-btn"
                            }
                            onClick={() => handleKeypadPress(key)}
                            disabled={!running}
                          >
                            {key}
                          </button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              )}

              <div className="center-row">
                <button
                  className="primary-button"
                  onClick={startGame}
                  style={{ padding: "8px 20px" }}
                >
                  시작하기
                </button>
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracyPercent}</span>
              <span className="label">정답 속도(평균)</span>
              <span className="value">{avgCorrectSpeedDisplay}</span>
            </div>

            {finishedSummary && (
              <div className="result ok">
                타임어택 종료! 🎉
                <br />
                {timeLimitSec}초 동안 총 {finishedSummary.total}문제 중{" "}
                {finishedSummary.correct}개 정답, 정답률{" "}
                {finishedSummary.total > 0
                  ? Math.round(
                      (finishedSummary.correct / finishedSummary.total) * 100
                    ) + "%"
                  : "-"}
                ,
                <br />
                정답 속도(평균){" "}
                {finishedSummary.avgCorrectSpeedSec != null
                  ? `${finishedSummary.avgCorrectSpeedSec.toFixed(2)}초`
                  : "-"}
                , 점수 {finishedSummary.score}, 등급{" "}
                {finishedSummary.grade || "-"} 등급!
              </div>
            )}

            {lastMessage && !finishedSummary && (
              <div className="result ok">{lastMessage}</div>
            )}

            <div className="small-tip">
              정답 사이의 시간과 타임아웃까지의 시간까지 모두 정답 속도에
              반영돼요.
              <br />
              끝까지 꾸준히 풀수록 좋은 등급을 받기 쉬워요.
            </div>
          </>
        );
      }

      // ===== 미션/기록 탭 =====
      function MissionsTab({ records }) {
        const today = todayYMD();
        const todayDate = new Date();
        const { label: weekLabel } = getWeekInfo(todayDate);

        const todayRecords = records.filter((r) => r.date === today);
        const weekInfo = getWeekInfo(todayDate);

        const weekRecords = records.filter((r) => {
          const [y, m, d] = r.date.split("-").map((x) => parseInt(x, 10));
          const dt = new Date(y, m - 1, d);
          return dt >= weekInfo.monday && dt <= weekInfo.sunday;
        });

        const todayCount60 = todayRecords.filter(
          (r) => r.durationSec === 60
        ).length;
        const todayCorrectSum = todayRecords.reduce(
          (s, r) => s + (r.correct || 0),
          0
        );
        const todayBestGrade = todayRecords.reduce((best, r) => {
          if (gradePriority(r.grade) > gradePriority(best)) return r.grade;
          return best;
        }, "-");

        const weekCountAll = weekRecords.length;
        const weekCorrectSum = weekRecords.reduce(
          (s, r) => s + (r.correct || 0),
          0
        );

        const dailyMissions = [
          {
            id: "daily_60s_2times",
            title: "60초 타임어택 2회 도전",
            done: todayCount60 >= 2,
            progress: `${todayCount60} / 2회`,
          },
          {
            id: "daily_correct_30",
            title: "정답 30개 맞히기",
            done: todayCorrectSum >= 30,
            progress: `${todayCorrectSum} / 30개`,
          },
          {
            id: "daily_grade_A_or_S",
            title: "오늘 A 또는 S 등급 한 번 달성",
            done: gradePriority(todayBestGrade) >= gradePriority("A"),
            progress:
              todayBestGrade === "-"
                ? "아직 등급 없음"
                : `현재 최고 등급: ${todayBestGrade}`,
          },
        ];

        const weeklyMissions = [
          {
            id: "weekly_20_times",
            title: "이번 주 타임어택 20회 도전",
            done: weekCountAll >= 20,
            progress: `${weekCountAll} / 20회`,
          },
          {
            id: "weekly_200_correct",
            title: "이번 주 정답 200개 이상",
            done: weekCorrectSum >= 200,
            progress: `${weekCorrectSum} / 200개`,
          },
        ];

        return (
          <>
            <div className="section-card">
              <div className="section-title-row">
                <div className="section-title">
                  오늘의 미션 (모두 타임어택으로 달성)
                </div>
              </div>
              <div className="mission-list">
                {dailyMissions.map((m) => (
                  <div key={m.id}>
                    <div className="mission-row">
                      <div className="mission-main">· {m.title}</div>
                      <div
                        className={
                          "mission-status " + (m.done ? "done" : "doing")
                        }
                      >
                        {m.done ? "달성" : "진행중"}
                      </div>
                    </div>
                    <div className="mission-sub">{m.progress}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="section-card">
              <div className="section-title-row">
                <div className="section-title">
                  주간 미션 (이번 주: {weekLabel})
                </div>
              </div>
              <div className="mission-list">
                {weeklyMissions.map((m) => (
                  <div key={m.id}>
                    <div className="mission-row">
                      <div className="mission-main">· {m.title}</div>
                      <div
                        className={
                          "mission-status " + (m.done ? "done" : "doing")
                        }
                      >
                        {m.done ? "달성" : "진행중"}
                      </div>
                    </div>
                    <div className="mission-sub">{m.progress}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="small-tip">
              모든 미션은 60초 타임어택 기록을 기준으로 계산됩니다.
              <br />
              S/A 등급을 받으면 용돈 미션 달성으로 연결되게 설계해 두었어요.
            </div>
          </>
        );
      }

      function RecordsTab({ records }) {
        if (!records || records.length === 0) {
          return (
            <div className="section-card">
              <div className="section-title">아직 기록이 없어요</div>
              <div style={{ marginTop: 4, fontSize: "0.8rem" }}>
                타임어택 모드에서 게임을 마치면 이곳에 기록이 쌓입니다.
              </div>
            </div>
          );
        }

        const bestRecord = [...records].sort((a, b) => {
          const gp = gradePriority(b.grade) - gradePriority(a.grade);
          if (gp !== 0) return gp;
          if ((b.score || 0) !== (a.score || 0)) {
            return (b.score || 0) - (a.score || 0);
          }
          return (b.correct || 0) - (a.correct || 0);
        })[0];

        const top10 = [...records]
          .sort((a, b) => {
            const gp = gradePriority(b.grade) - gradePriority(a.grade);
            if (gp !== 0) return gp;
            if ((b.score || 0) !== (a.score || 0)) {
              return (b.score || 0) - (a.score || 0);
            }
            return (b.correct || 0) - (a.correct || 0);
          })
          .slice(0, 10);

        const gradeLabel = (g) =>
          g === "-" || !g ? "등급 없음" : `${g} 등급`;

        return (
          <>
            <div className="section-card">
              <div className="section-title">이 기기의 최고 기록</div>
              <div style={{ marginTop: 4, fontSize: "0.8rem" }}>
                {bestRecord.durationSec}초 · {bestRecord.date}
                <br />
                {bestRecord.correct}/{bestRecord.total} 정답, 정답률{" "}
                {bestRecord.total > 0
                  ? Math.round((bestRecord.correct / bestRecord.total) * 100) +
                    "%"
                  : "-"}
                , 정답 속도{" "}
                {bestRecord.avgCorrectSpeedSec != null
                  ? `${bestRecord.avgCorrectSpeedSec.toFixed(2)}초`
                  : "-"}
                , 점수 {bestRecord.score}, {gradeLabel(bestRecord.grade)}
              </div>
            </div>

            <div className="section-card">
              <div className="section-title">역대 최고 기록 TOP 10</div>
              <table className="records-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>날짜</th>
                    <th>시간</th>
                    <th>정답/문제</th>
                    <th>정답률</th>
                    <th>속도(초)</th>
                    <th>점수</th>
                    <th>등급</th>
                  </tr>
                </thead>
                <tbody>
                  {top10.map((r, idx) => (
                    <tr
                      key={idx}
                      className={
                        r === bestRecord ? "highlight-row" : undefined
                      }
                    >
                      <td>{idx + 1}</td>
                      <td>{r.date}</td>
                      <td>{r.durationSec}s</td>
                      <td>
                        {r.correct}/{r.total}
                      </td>
                      <td>
                        {r.total > 0
                          ? Math.round((r.correct / r.total) * 100) + "%"
                          : "-"}
                      </td>
                      <td>
                        {r.avgCorrectSpeedSec != null
                          ? r.avgCorrectSpeedSec.toFixed(2)
                          : "-"}
                      </td>
                      <td>{r.score}</td>
                      <td>{r.grade || "-"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="small-tip">
              기록은 이 기기(브라우저)에만 저장됩니다.
              <br />
              유라가 “내가 전에 얼마나 잘했지?” 하고 궁금해할 때 같이 보는
              용도예요.
            </div>
          </>
        );
      }

      // ===== 메인 App =====
      function App() {
        const [mode, setMode] = useState("timeAttack");
        const [profile, setProfile] = useState(() => loadProfile());
        const [records, setRecords] = useState(() => loadRecords());

        const loadedSettings = loadSettings();
        const [timeLimitSec, setTimeLimitSec] = useState(
          loadedSettings?.timeLimitSec || 60
        );
        const [answerType, setAnswerType] = useState(
          loadedSettings?.answerType || "choice"
        );
        const [keyboardMode, setKeyboardMode] = useState(
          loadedSettings?.keyboardMode || "screen"
        );

        const [showSettings, setShowSettings] = useState(false);
        const [missionPopup, setMissionPopup] = useState(null);

        useEffect(() => {
          saveProfile(profile);
        }, [profile]);

        useEffect(() => {
          saveRecords(records);
        }, [records]);

        useEffect(() => {
          saveSettings({ timeLimitSec, answerType, keyboardMode });
        }, [timeLimitSec, answerType, keyboardMode]);

        const handleGameFinished = (result) => {
          setRecords((prev) => [...prev, result]);

          let gainedXp = 0;
          gainedXp += result.correct * 10;
          if (result.grade === "S") gainedXp += 200;
          else if (result.grade === "A") gainedXp += 120;
          else if (result.grade === "B") gainedXp += 60;
          else if (result.grade === "C") gainedXp += 30;

          const newTotalXp = (profile.totalXp || 0) + gainedXp;
          setProfile({ ...profile, totalXp: newTotalXp });

          const today = todayYMD();
          const todayRecords = [...records, result].filter(
            (r) => r.date === today
          );
          const todayCount60 = todayRecords.filter(
            (r) => r.durationSec === 60
          ).length;
          const todayCorrectSum = todayRecords.reduce(
            (s, r) => s + (r.correct || 0),
            0
          );
          const todayBestGrade = todayRecords.reduce((best, r) => {
            if (gradePriority(r.grade) > gradePriority(best)) return r.grade;
            return best;
          }, "-");

          const dailyDone =
            todayCount60 >= 2 &&
            todayCorrectSum >= 30 &&
            gradePriority(todayBestGrade) >= gradePriority("A");

          if (dailyDone && result.durationSec === 60) {
            const gradeText = result.grade || "-";
            const shareText = [
              `[유라의 구구런 오늘 미션 완료 보고서]`,
              ``,
              `오늘 타임어택 결과는 ${result.durationSec}초 동안`,
              `${result.total}문제 중 ${result.correct}개 정답!`,
              `정답률 ${
                result.total > 0
                  ? Math.round((result.correct / result.total) * 100) + "%"
                  : "-"
              }, 정답 속도 평균 ${
                result.avgCorrectSpeedSec != null
                  ? result.avgCorrectSpeedSec.toFixed(2) + "초"
                  : "-"
              }`,
              `등급은 ${gradeText} 등급이얌!`,
              ``,
              gradeText === "S"
                ? "오늘은 S급이라 용돈 1,000원 줘야 하는 거 아님? 😏"
                : gradeText === "A"
                ? "오늘은 A급이니까 용돈 500원 달라고요~ 😎"
                : "오늘은 연습 느낌이라 등급은 살짝 아쉽지만, 내일 더 잘할 거임!",
            ].join("\n");

            setMissionPopup({ text: shareText });
          }
        };

        const { level, xpInLevel, xpToNext } = calcLevelFromXp(
          profile.totalXp || 0
        );
        const title = getTitleForLevel(level);
        const levelBarWidth =
          xpToNext > 0
            ? `${Math.min(1, xpInLevel / xpToNext) * 100}%`
            : "100%";
        const nextLevelText =
          level === MAX_LEVEL
            ? "최고 레벨에 도달했어요!"
            : `다음 레벨까지 ${xpToNext - xpInLevel}점 남음`;

        const handleCopyShare = () => {
          if (!missionPopup) return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(missionPopup.text).catch(() => {});
          }
        };

        return (
          <>
            <div className="app">
              <div className="title">유라의 구구런 GUGU RUN</div>
              <div className="subtitle">
                구구단 속도 + 정확도 둘 다 잡기
              </div>

              <div className="header-row">
                <div className="level-card">
                  <div className="level-top">
                    <div className="level-name">{title}</div>
                    <div className="level-info">
                      Lv.{level} · 총 경험치 {profile.totalXp || 0}
                    </div>
                  </div>
                  <div className="level-bar-wrap">
                    <div
                      className="level-bar-inner"
                      style={{ width: levelBarWidth }}
                    ></div>
                  </div>
                  <div className="level-bottom">{nextLevelText}</div>
                </div>
                <button
                  className="settings-btn"
                  onClick={() => setShowSettings(true)}
                  title="설정"
                >
                  <span>⚙️</span>
                </button>
              </div>

              <div className="tabs">
                <button
                  className={
                    "tab-btn " + (mode === "practice" ? "active" : "")
                  }
                  onClick={() => setMode("practice")}
                >
                  연습
                </button>
                <button
                  className={
                    "tab-btn " + (mode === "timeAttack" ? "active" : "")
                  }
                  onClick={() => setMode("timeAttack")}
                >
                  타임어택
                </button>
                <button
                  className={
                    "tab-btn " + (mode === "missions" ? "active" : "")
                  }
                  onClick={() => setMode("missions")}
                >
                  미션
                </button>
                <button
                  className={
                    "tab-btn " + (mode === "records" ? "active" : "")
                  }
                  onClick={() => setMode("records")}
                >
                  기록
                </button>
              </div>

              {mode === "practice" && <PracticeMode />}

              {mode === "timeAttack" && (
                <TimeAttackMode
                  timeLimitSec={timeLimitSec}
                  answerType={answerType}
                  keyboardMode={keyboardMode}
                  onGameFinished={handleGameFinished}
                />
              )}

              {mode === "missions" && <MissionsTab records={records} />}

              {mode === "records" && <RecordsTab records={records} />}
            </div>

            {showSettings && (
              <div className="settings-overlay">
                <div className="settings-modal">
                  <div className="settings-modal-title">설정</div>
                  <div className="settings-panel">
                    <div className="settings-row">
                      <label>타임어택 시간</label>
                      <div className="settings-options">
                        {[30, 60].map((sec) => (
                          <button
                            key={sec}
                            className={
                              "settings-chip " +
                              (timeLimitSec === sec ? "active" : "")
                            }
                            onClick={() => setTimeLimitSec(sec)}
                          >
                            {sec}초
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="settings-row">
                      <label>문제 유형</label>
                      <div className="settings-options">
                        <button
                          className={
                            "settings-chip " +
                            (answerType === "choice" ? "active" : "")
                          }
                          onClick={() => setAnswerType("choice")}
                        >
                          객관식
                        </button>
                        <button
                          className={
                            "settings-chip " +
                            (answerType === "input" ? "active" : "")
                          }
                          onClick={() => setAnswerType("input")}
                        >
                          주관식
                        </button>
                      </div>
                    </div>

                    {answerType === "input" && (
                      <div className="settings-row">
                        <label>주관식 입력 방식</label>
                        <div className="settings-options">
                          <button
                            className={
                              "settings-chip " +
                              (keyboardMode === "system" ? "active" : "")
                            }
                            onClick={() => setKeyboardMode("system")}
                          >
                            시스템 키보드
                          </button>
                          <button
                            className={
                              "settings-chip " +
                              (keyboardMode === "screen" ? "active" : "")
                            }
                            onClick={() => setKeyboardMode("screen")}
                          >
                            스크린 키보드
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="settings-footer">
                    <button
                      className="secondary-button"
                      onClick={() => setShowSettings(false)}
                    >
                      닫기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {missionPopup && (
              <div className="mission-popup-overlay">
                <div className="mission-popup">
                  <div className="mission-popup-title">
                    오늘 미션 달성 완료! 🎉
                  </div>
                  <div className="mission-popup-body">
                    {missionPopup.text}
                  </div>
                  <div className="mission-popup-buttons">
                    <button
                      className="secondary-button"
                      onClick={() => setMissionPopup(null)}
                    >
                      닫기
                    </button>
                    <button
                      className="primary-button"
                      onClick={() => {
                        handleCopyShare();
                        alert(
                          "결과 문구를 클립보드에 복사했어요.\n카카오톡 가족방에 붙여넣기 해서 보내면 돼요!"
                        );
                      }}
                    >
                      결과 공유하기 (복사)
                    </button>
                  </div>
                  <div className="copy-hint">
                    * 버튼을 누르면 문구가 자동으로 복사됩니다.
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
