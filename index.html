<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유라의 구구런 GUGU RUN - 구구단 타임어택 연습</title>
    <!-- 반응형 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #ccf6ff, #e0fffb);
        color: #333;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding-top: 8px;
      }

      .app {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 18px 16px;
        border-radius: 24px;
        background: #f7feff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        border: 1px solid #b3ecff;
      }

      .title {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 4px;
        background: linear-gradient(90deg, #00c9a7, #00a8ff);
        -webkit-background-clip: text;
        color: transparent;
      }

      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #28708a;
        margin-bottom: 8px;
      }

      .question-box {
        margin: 10px 0;
        padding: 14px 10px;
        border-radius: 18px;
        background: #e7fbff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 1px dashed #7ee0ff;
      }

      .question-label {
        font-size: 0.85rem;
        color: #28708a;
      }

      .question {
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .timer {
        font-size: 0.85rem;
        color: #00a8ff;
      }

      .stats {
        margin-top: 10px;
        padding: 10px 8px;
        border-radius: 14px;
        background: #f0fcff;
        font-size: 0.85rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 2px;
        border: 1px solid #ccefff;
      }

      .stats span.label {
        color: #567;
      }

      .stats span.value {
        font-weight: 600;
      }

      .result {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 0.9rem;
      }

      .result.ok {
        background: #e3fbf3;
        color: #0c7a4c;
      }

      .result.bad {
        background: #ffeef0;
        color: #c62828;
      }

      .small-tip {
        margin-top: 6px;
        font-size: 0.78rem;
        color: #567;
        text-align: center;
      }

      .primary-button {
        padding: 8px 14px;
        border-radius: 16px;
        border: none;
        background: linear-gradient(135deg, #00c9a7, #00a8ff);
        color: white;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      /* 객관식 선택지 스타일 */
      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
        width: 100%;
      }

      .choice-btn {
        padding: 8px 0;
        border-radius: 14px;
        border: none;
        background: #ffffff;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.06);
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
      }

      .choice-btn:active {
        transform: translateY(1px);
      }

      .section-title {
        font-size: 0.78rem;
        color: #456;
      }

      .pill-chip {
        padding: 4px 8px;
        border-radius: 999px;
        border: none;
        font-size: 0.78rem;
        cursor: pointer;
        background: #d3f8ff;
        color: #28708a;
      }

      .pill-chip.active {
        background: #00c9a7;
        color: #fff;
      }

      .tab-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        margin-bottom: 4px;
      }

      .tab-btn {
        flex: 1;
        padding: 8px 0;
        border-radius: 16px;
        border: none;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        background: #d3f8ff;
        color: #28708a;
      }

      .tab-btn.active {
        background: linear-gradient(135deg, #00c9a7, #00a8ff);
        color: #fff;
      }

      .share-row {
        margin-top: 6px;
        text-align: center;
      }

      .share-button {
        padding: 6px 10px;
        border-radius: 14px;
        border: none;
        background: #ffdd57;
        color: #5a4300;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .share-button:active {
        transform: translateY(1px);
      }

      .records-box {
        margin-top: 6px;
        padding: 10px 8px;
        border-radius: 14px;
        background: #f0fcff;
        font-size: 0.8rem;
        color: #345;
        border: 1px solid #ccefff;
      }

      .records-box ul {
        margin: 4px 0 0;
        padding-left: 16px;
      }

      .records-box li {
        margin-bottom: 2px;
      }

      @media (max-width: 400px) {
        .app {
          padding: 14px 12px;
          border-radius: 20px;
        }
        .question {
          font-size: 1.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM & Babel (개발용) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 코드 -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function getRandomQuestion() {
        const a = Math.floor(Math.random() * 8) + 2; // 2~9
        const b = Math.floor(Math.random() * 9) + 1; // 1~9
        return { a, b };
      }

      // 정답 근처 숫자 위주의 6지선다
      function getChoices(correct) {
        const set = new Set();
        set.add(correct);

        while (set.size < 6) {
          const delta = Math.floor(Math.random() * 9) - 4; // -4 ~ +4
          if (delta === 0) continue;
          const candidate = correct + delta;
          if (candidate <= 0) continue;
          set.add(candidate);
        }

        return Array.from(set).sort(() => Math.random() - 0.5); // 섞기
      }

      // 바로 직전 문제와 같지 않도록 보장
      function getQuestionWithChoices(prevQuestion) {
        let base;
        do {
          base = getRandomQuestion();
        } while (
          prevQuestion &&
          base.a === prevQuestion.a &&
          base.b === prevQuestion.b
        );

        const correct = base.a * base.b;
        return {
          ...base,
          choices: getChoices(correct),
        };
      }

      // ===== 로컬스토리지 유틸 =====
      const STORAGE_KEY = "gugurun_timeattack_records";

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch (e) {
          return [];
        }
      }

      function saveRecord(record) {
        try {
          const records = loadRecords();
          records.push(record);
          const trimmed = records.slice(-200);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
          return trimmed;
        } catch (e) {
          return null;
        }
      }

      function compareRecord(a, b) {
        if (a.correct !== b.correct) return b.correct - a.correct;
        if (a.total !== b.total) return b.total - a.total;
        const at = parseFloat(a.avgTime || "999");
        const bt = parseFloat(b.avgTime || "999");
        if (!isNaN(at) && !isNaN(bt) && at !== bt) return at - bt;
        return (b.timestamp || 0) - (a.timestamp || 0);
      }

      function pickBestRecord(records) {
        if (!records || records.length === 0) return null;
        const sorted = [...records].sort(compareRecord);
        return sorted[0];
      }

      function getTopRecords(records, limit = 10) {
        if (!records || records.length === 0) return [];
        const sorted = [...records].sort(compareRecord);
        return sorted.slice(0, limit);
      }

      // ========= 연습 모드 =========
      function PracticeMode() {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [lastCorrect, setLastCorrect] = useState(null);
        const [lastMessage, setLastMessage] = useState("");
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastCorrect(true);
            setLastMessage(
              `정답! ${correctAnswer} ✨ (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastCorrect(false);
            setLastMessage(
              `아쉬워요! 정답은 ${correctAnswer} 입니다. (${elapsed.toFixed(
                2
              )}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                연습 모드 - 객관식 스피드 연습
              </div>
              <div className="question">
                {question.a} × {question.b} = ?
              </div>
              <div className="timer">
                문제 보인 지{" "}
                {((Date.now() - questionStart) / 1000).toFixed(1)}초 경과
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="stats">
              <span className="label">총 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {lastMessage && (
              <div className={`result ${lastCorrect ? "ok" : "bad"}`}>
                {lastMessage}
              </div>
            )}

            <div className="small-tip">
              답을 <b>톡톡 누르기만</b> 하면 되는 연습 모드예요. <br />
              눈으로 바로 계산해서 “머릿속 계산기”를 키워보자!
            </div>
          </>
        );
      }

      // ========= 타임어택 모드 =========
      function TimeAttackMode({ timeLimitMs, onFinished }) {
        const [question, setQuestion] = useState(() =>
          getQuestionWithChoices(null)
        );
        const [questionStart, setQuestionStart] = useState(Date.now());
        const [running, setRunning] = useState(false);
        const [timeLeftMs, setTimeLeftMs] = useState(timeLimitMs);
        const [total, setTotal] = useState(0);
        const [correct, setCorrect] = useState(0);
        const [sumTime, setSumTime] = useState(0);
        const [lastMessage, setLastMessage] = useState("");
        const [finished, setFinished] = useState(false);
        const [justSetNewBest, setJustSetNewBest] = useState(false);
        const timerRef = useRef(null);

        const timeLimitSec = Math.round(timeLimitMs / 1000);

        // 타임 제한 변경 시 상태 초기화
        useEffect(() => {
          setRunning(false);
          setFinished(false);
          setTimeLeftMs(timeLimitMs);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setJustSetNewBest(false);
        }, [timeLimitMs]);

        const startGame = () => {
          setRunning(true);
          setFinished(false);
          setTimeLeftMs(timeLimitMs);
          setTotal(0);
          setCorrect(0);
          setSumTime(0);
          setLastMessage("");
          setJustSetNewBest(false);
          setQuestion((prev) => getQuestionWithChoices(prev));
          setQuestionStart(Date.now());
        };

        useEffect(() => {
          if (!running) {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
            return;
          }

          timerRef.current = setInterval(() => {
            setTimeLeftMs((prev) => {
              const next = prev - 100;
              if (next <= 0) {
                clearInterval(timerRef.current);
                timerRef.current = null;
                setRunning(false);
                setFinished(true);
                return 0;
              }
              return next;
            });
          }, 100);

          return () => {
            if (timerRef.current) {
              clearInterval(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [running]);

        useEffect(() => {
          setQuestionStart(Date.now());
        }, [question]);

        const handleChoice = (choice) => {
          if (!running) return;

          const now = Date.now();
          const elapsed = (now - questionStart) / 1000;
          const correctAnswer = question.a * question.b;

          setTotal((t) => t + 1);
          setSumTime((s) => s + elapsed);

          if (choice === correctAnswer) {
            setCorrect((c) => c + 1);
            setLastMessage(
              `굿! 정답 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          } else {
            setLastMessage(
              `앗! 정답은 ${correctAnswer} (${elapsed.toFixed(2)}초)`
            );
          }

          setQuestion((prev) => getQuestionWithChoices(prev));
        };

        const secondsLeft = (timeLeftMs / 1000).toFixed(1);
        const avgTime = total > 0 ? (sumTime / total).toFixed(2) : "-";
        const accuracy =
          total > 0 ? Math.round((correct / total) * 100) + "%" : "-";

        let grade = "-";
        if (avgTime !== "-" && total > 0) {
          const t = parseFloat(avgTime);
          if (t < 1.5) grade = "S";
          else if (t < 2.5) grade = "A";
          else if (t < 3.5) grade = "B";
          else grade = "C";
        }

        // 타임어택 끝났을 때 상위 컴포넌트에 결과 전달 + 저장
        useEffect(() => {
          if (!finished || total === 0) return;

          const record = {
            timestamp: Date.now(),
            total,
            correct,
            accuracy,
            avgTime,
            grade,
            timeLimitSec,
          };

          const records = saveRecord(record);
          let isNewBest = false;
          if (records) {
            const best = pickBestRecord(records);
            if (best && compareRecord(record, best) === 0) {
              isNewBest = true;
            }
          }
          setJustSetNewBest(isNewBest);

          if (onFinished) {
            onFinished(record);
          }
        }, [finished]); // eslint-disable-line react-hooks/exhaustive-deps

        const shareResult = async () => {
          const summary =
            `【유라의 구구런 타임어택 결과】\n` +
            `짱구도 놀랄 구구단 실력 등장!\n\n` +
            `⏱ 타임어택: ${timeLimitSec}초\n` +
            `✅ 정답: ${correct}/${total} (${accuracy})\n` +
            `⚡ 평균 반응속도: ${avgTime}초\n` +
            `🏅 등급: ${grade} 등급\n\n` +
            `\"아빠, 나 완전 천재 아냐?\" 느낌의 기록입니다 😄\n` +
            `- from 유라의 구구런 GUGU RUN`;

          if (navigator.share) {
            try {
              await navigator.share({
                title: "유라의 구구런 GUGU RUN",
                text: summary,
                url: window.location.href,
              });
              return;
            } catch (e) {}
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(summary);
              alert(
                "타임어택 결과를 클립보드에 복사했어요.\n카카오톡을 열고 채팅창에 붙여넣기 해서 공유해 주세요!"
              );
              return;
            } catch (e) {}
          }

          window.prompt(
            "이 텍스트를 전체 선택(Ctrl+A) 후 복사해서 카카오톡에 붙여넣기 해 주세요:",
            summary
          );
        };

        return (
          <>
            <div className="question-box">
              <div className="question-label">
                타임어택 모드 - {timeLimitSec}초 안에 최대한 많이!
              </div>

              <div className="timer">
                남은 시간:{" "}
                <b style={{ color: timeLeftMs < 10000 ? "#c62828" : "#00a8ff" }}>
                  {secondsLeft}초
                </b>
              </div>

              <div className="question" style={{ marginTop: 4 }}>
                {question.a} × {question.b} = ?
              </div>

              <div className="choices">
                {question.choices.map((c) => (
                  <button
                    key={c}
                    className="choice-btn"
                    onClick={() => handleChoice(c)}
                    disabled={!running}
                  >
                    {c}
                  </button>
                ))}
              </div>

              <div style={{ marginTop: 8, textAlign: "center" }}>
                <button
                  className="primary-button"
                  onClick={startGame}
                  style={{ padding: "6px 14px" }}
                >
                  {running ? "다시 시작" : "시작하기"}
                </button>
              </div>
            </div>

            <div className="stats">
              <span className="label">푼 문제 수</span>
              <span className="value">{total}</span>
              <span className="label">정답 개수</span>
              <span className="value">{correct}</span>
              <span className="label">정답률</span>
              <span className="value">{accuracy}</span>
              <span className="label">평균 반응속도</span>
              <span className="value">
                {avgTime === "-" ? "-" : `${avgTime}초`}
              </span>
            </div>

            {finished && (
              <>
                <div className="result ok">
                  타임어택 종료! 🎉
                  <br />
                  <b>{total}</b>문제 중 <b>{correct}</b>개 정답, 정답률{" "}
                  {accuracy},{" "}
                  <br />
                  평균 {avgTime === "-" ? "-" : `${avgTime}초`} / 등급 {grade} 등급!
                  {justSetNewBest && (
                    <>
                      <br />
                      ✨ 짱구도 박수칠 최고 기록 갱신!
                    </>
                  )}
                </div>
                <div className="share-row">
                  <button className="share-button" onClick={shareResult}>
                    결과 공유하기 (카카오톡 등)
                  </button>
                </div>
              </>
            )}

            {lastMessage && !finished && (
              <div className="result ok">{lastMessage}</div>
            )}

            <div className="small-tip">
              버튼만 톡톡 눌러도 되는 스피드 모드! <br />
              “몇 초에 한 문제씩” 풀고 있는지 기록을 노려보자.
            </div>
          </>
        );
      }

      // ========= 기록 보기 탭 =========
      function RecordsView({ lastRecord }) {
        const [bestRecord, setBestRecord] = useState(null);
        const [topRecords, setTopRecords] = useState([]);

        const reload = () => {
          const records = loadRecords();
          setBestRecord(pickBestRecord(records));
          setTopRecords(getTopRecords(records, 10));
        };

        useEffect(() => {
          reload();
        }, []);

        // 타임어택 막 끝나고 돌아왔을 때 새 기록 반영
        useEffect(() => {
          if (lastRecord) reload();
        }, [lastRecord]);

        return (
          <div>
            {bestRecord ? (
              <div className="records-box">
                <b>이 기기의 최고 기록</b>
                <br />
                {bestRecord.timeLimitSec || 60}초 /{" "}
                {bestRecord.correct}/{bestRecord.total} 정답, 정답률{" "}
                {bestRecord.accuracy}, 평균 {bestRecord.avgTime}초, 등급{" "}
                {bestRecord.grade}
              </div>
            ) : (
              <div className="records-box">
                아직 기록이 없어요. <br />
                타임어택 모드에서 첫 기록을 만들어 보세요!
              </div>
            )}

            {topRecords && topRecords.length > 0 && (
              <div className="records-box">
                <b>역대 최고 기록 TOP 10 (이 기기 기준)</b>
                <ul>
                  {topRecords.map((r, idx) => {
                    const d = r.timestamp ? new Date(r.timestamp) : null;
                    const dateStr = d
                      ? d.toLocaleDateString("ko-KR", {
                          month: "short",
                          day: "numeric",
                        })
                      : "";
                    const sec = r.timeLimitSec || 60;
                    return (
                      <li key={idx}>
                        #{idx + 1} | {sec}초 | {r.correct}/{r.total} 정답,
                        정답률 {r.accuracy}, 평균 {r.avgTime}초, 등급{" "}
                        {r.grade}
                        {dateStr && ` · ${dateStr}`}
                      </li>
                    );
                  })}
                </ul>
              </div>
            )}

            <div className="small-tip">
              기록은 이 폰에만 저장돼요. <br />
              유라가 “나 예전에 얼마나 잘했지?” 할 때, 여기서 구경하면 딱!
            </div>
          </div>
        );
      }

      // ========= 전체 App =========
      function App() {
        const [mode, setMode] = useState("practice"); // 'practice' | 'timeAttack' | 'records'
        const [timeLimitMs, setTimeLimitMs] = useState(30000); // 기본 30초
        const [lastRecord, setLastRecord] = useState(null);

        const timeLimitSec = Math.round(timeLimitMs / 1000);

        return (
          <div className="app">
            <div className="title">유라의 구구런 GUGU RUN</div>
            <div className="subtitle">
              민트 하늘색 구구단 연습장 · 속도 + 정확도 둘 다 잡기
            </div>

            {/* 타임어택 시간 선택 (기록 탭에서는 비활성 의미가 크지 않지만 그대로 표시) */}
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                marginBottom: 4,
                gap: 6,
              }}
            >
              <span className="section-title">타임어택 시간</span>
              <div style={{ display: "flex", gap: 4 }}>
                <button
                  className={
                    "pill-chip" + (timeLimitSec === 30 ? " active" : "")
                  }
                  onClick={() => setTimeLimitMs(30000)}
                >
                  30초
                </button>
                <button
                  className={
                    "pill-chip" + (timeLimitSec === 60 ? " active" : "")
                  }
                  onClick={() => setTimeLimitMs(60000)}
                >
                  60초
                </button>
              </div>
            </div>

            {/* 모드 선택 탭 */}
            <div className="tab-row">
              <button
                className={"tab-btn" + (mode === "practice" ? " active" : "")}
                onClick={() => setMode("practice")}
              >
                연습
              </button>
              <button
                className={"tab-btn" + (mode === "timeAttack" ? " active" : "")}
                onClick={() => setMode("timeAttack")}
              >
                타임어택
              </button>
              <button
                className={"tab-btn" + (mode === "records" ? " active" : "")}
                onClick={() => setMode("records")}
              >
                기록 보기
              </button>
            </div>

            {mode === "practice" && <PracticeMode />}
            {mode === "timeAttack" && (
              <TimeAttackMode
                timeLimitMs={timeLimitMs}
                onFinished={(r) => setLastRecord(r)}
              />
            )}
            {mode === "records" && <RecordsView lastRecord={lastRecord} />}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
